<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Deudas</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deudas">
<meta name="mobile-web-app-capable" content="yes">
<script>
// Se aplica el tema guardado ANTES de pintar, para que no se vea el destello
// blanco al abrir la app en modo oscuro.
(function () {
  try {
    var t = localStorage.getItem("dd_theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.querySelector('meta[name="theme-color"]').content = dark ? "#0d0d0f" : "#ffffff";
  } catch (e) {}
})();
</script>
<style>
/* ===========================================================================
   Estilo minimalista, con tema claro y oscuro (mismas convenciones que
   asistencia-obra): todo el color sale de tokens, sin sombras salvo en lo que
   flota, y el COLOR con significado se reserva para dos cosas: el sentido de un
   movimiento (prestamo sube / abono baja) y las series de los graficos.

   Los colores de las series (--s1..--s6) son la paleta validada del metodo de
   visualizacion: pasan las pruebas de daltonismo en los dos temas.
   =========================================================================== */
*, *::before, *::after { box-sizing:border-box; }

:root {
  --bg:#f7f7f8; --card:#fff; --soft:#fafafa;
  --ink:#18181b; --on-ink:#fff; --muted:#71717a; --faint:#a1a1aa;
  --line:#e8e8eb; --line-2:#d6d6db;
  --glass:rgba(255,255,255,.86); --veil:rgba(24,24,27,.32);
  --shadow:0 12px 32px rgba(24,24,27,.16);

  --ok:#15803d;   --ok-bg:#f1faf3;   --ok-line:#9ccbaf;    /* abono */
  --bad:#b91c1c;  --bad-bg:#fdf2f2;  --bad-line:#e6adad;   /* prestamo / error */
  --half:#a16207; --half-bg:#fdf9ed; --half-line:#dcc588;  /* aviso */

  /* series de los graficos (paleta validada, tema claro) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --grid:#e8e8eb; --axis:#c9c9ce;

  --r:10px; --r-sm:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0d0d0f; --card:#171719; --soft:#1f1f23;
    --ink:#f4f4f5; --on-ink:#0d0d0f; --muted:#a1a1aa; --faint:#6f6f78;
    --line:#26262a; --line-2:#3a3a41;
    --glass:rgba(13,13,15,.86); --veil:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
    --ok:#4ade80;   --ok-bg:#122318;   --ok-line:#2c5f3d;
    --bad:#f87171;  --bad-bg:#271515;  --bad-line:#6e3434;
    --half:#fbbf24; --half-bg:#251d0f; --half-line:#6b521c;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --grid:#26262a; --axis:#3a3a41;
    color-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0d0d0f; --card:#171719; --soft:#1f1f23;
  --ink:#f4f4f5; --on-ink:#0d0d0f; --muted:#a1a1aa; --faint:#6f6f78;
  --line:#26262a; --line-2:#3a3a41;
  --glass:rgba(13,13,15,.86); --veil:rgba(0,0,0,.6); --shadow:0 12px 32px rgba(0,0,0,.5);
  --ok:#4ade80;   --ok-bg:#122318;   --ok-line:#2c5f3d;
  --bad:#f87171;  --bad-bg:#271515;  --bad-line:#6e3434;
  --half:#fbbf24; --half-bg:#251d0f; --half-line:#6b521c;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --grid:#26262a; --axis:#3a3a41;
  color-scheme:dark;
}

html, body { margin:0; padding:0; }
body {
  background:var(--bg); color:var(--ink);
  font:15.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  letter-spacing:-0.004em; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
  padding-bottom:calc(70px + env(safe-area-inset-bottom));
  overflow-x:hidden; overscroll-behavior-y:contain;
}
body.no-nav { padding-bottom:0; }
button, input, select, textarea { font:inherit; color:inherit; letter-spacing:inherit; }
button { cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.chip, nav.bottom button, .seg button, .tabs button { -webkit-user-select:none; user-select:none; }
:focus-visible { outline:2px solid var(--ink); outline-offset:2px; border-radius:4px; }
a { color:var(--ink); }
.hidden { display:none !important; }
.vhidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
svg.i { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }

/* ------------------------------------------------------------------ layout */
.wrap { max-width:680px; margin:0 auto; padding:0 16px; }
header.top {
  position:sticky; top:0; z-index:20; background:var(--glass); backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--line); padding:calc(11px + env(safe-area-inset-top)) 16px 11px;
}
header.top .bar { max-width:680px; margin:0 auto; display:flex; align-items:center; gap:12px; }
header.top .mark {
  width:32px; height:32px; border-radius:9px; background:var(--ink); color:var(--on-ink);
  display:flex; align-items:center; justify-content:center; flex:none;
}
header.top .mark svg { width:18px; height:18px; }
header.top .title { flex:1; min-width:0; }
header.top .title .lbl { display:block; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); margin-bottom:1px; }
header.top .title .val { display:block; font-weight:600; font-size:16.5px; letter-spacing:-.015em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
header.top button.ghost {
  background:none; border:1px solid var(--line-2); color:var(--ink); border-radius:999px;
  padding:7px 12px; font-size:13px; font-weight:600; min-width:40px; min-height:36px;
}

h2 { font-size:20px; font-weight:600; letter-spacing:-.02em; margin:22px 0 12px; }
h3 { font-size:11px; font-weight:600; margin:22px 0 8px; color:var(--faint); text-transform:uppercase; letter-spacing:.09em; }
.sec-head { display:flex; align-items:center; gap:10px; margin:22px 0 10px; }
.sec-head h2, .sec-head h3 { margin:0; flex:1; }

/* ------------------------------------------------------------- componentes */
.card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.pad { padding:16px; }
.row { display:flex; align-items:center; gap:10px; }
.grow { flex:1; min-width:0; }
.muted { color:var(--muted); font-size:13px; }
.ellip { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.num { font-variant-numeric:tabular-nums; }

.btn {
  border:1px solid var(--line-2); background:var(--card); border-radius:var(--r-sm);
  padding:11px 15px; font-weight:500; font-size:15px; min-height:46px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:background .12s, border-color .12s, opacity .12s;
}
.btn svg { width:16px; height:16px; }
.btn:hover { background:var(--soft); }
.btn.primary { background:var(--ink); border-color:var(--ink); color:var(--on-ink); font-weight:600; }
.btn.primary:hover { opacity:.88; background:var(--ink); }
.btn.wide { width:100%; }
.btn.sm { padding:7px 12px; min-height:38px; font-size:13.5px; }
.btn.sm svg { width:14px; height:14px; }
.btn.danger { color:var(--bad); border-color:var(--bad-line); }
.btn.danger:hover { background:var(--bad-bg); }
.btn.solid-danger { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:600; }
.btn.good { color:var(--ok); border-color:var(--ok-line); }
.btn.good:hover { background:var(--ok-bg); }
.btn[disabled] { opacity:.45; pointer-events:none; }
.link { background:none; border:0; padding:0; font:inherit; color:var(--ink); font-weight:600; text-decoration:underline; cursor:pointer; }

.field { display:block; margin:0 0 14px; }
.field > span { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:6px; }
.field input, .field select, .field textarea {
  width:100%; padding:11px 13px; border:1px solid var(--line-2); border-radius:var(--r-sm);
  background:var(--card); min-height:46px; font-size:15.5px;
}
.field textarea { min-height:78px; resize:vertical; line-height:1.4; }
.field input:focus, .field select:focus, .field textarea:focus { outline:none; border-color:var(--ink); box-shadow:0 0 0 3px var(--line); }
.field input::placeholder, .field textarea::placeholder { color:var(--faint); }
.field .hint { display:block; font-size:12px; color:var(--faint); margin-top:5px; font-weight:400; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.msg { border-radius:var(--r-sm); padding:10px 13px; font-size:13.5px; margin:12px 0; }
.msg.err { background:var(--bad-bg); color:var(--bad); }
.msg.ok  { background:var(--ok-bg); color:var(--ok); }
.msg.warn { background:var(--half-bg); color:var(--half); }

.empty { text-align:center; color:var(--faint); padding:38px 18px; font-size:13.5px; line-height:1.6; }
.empty svg { width:26px; height:26px; margin-bottom:10px; opacity:.55; }

.chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.chip {
  border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:500;
  background:var(--card); border:1px solid var(--line); color:var(--muted);
  display:inline-flex; align-items:center; gap:6px; min-height:32px;
}
.chip:hover { border-color:var(--line-2); }
.chip.on { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
.badge {
  font-size:10.5px; font-weight:600; padding:2px 8px; border-radius:999px;
  background:var(--soft); border:1px solid var(--line); color:var(--muted);
  text-transform:uppercase; letter-spacing:.05em; white-space:nowrap;
}
.badge.admin { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
.badge.off { background:var(--bad-bg); border-color:var(--bad-line); color:var(--bad); }
.badge.good { background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok); }
.badge.warn { background:var(--half-bg); border-color:var(--half-line); color:var(--half); }

.list-item {
  display:flex; align-items:center; gap:12px; padding:14px 16px;
  border-bottom:1px solid var(--line); background:var(--card); width:100%; border-left:0; border-right:0; border-top:0;
  text-align:left; font-size:15px; color:var(--ink);
}
.list-item:hover { background:var(--soft); }
.list-item:last-child { border-bottom:0; }
.list-item > svg:first-child { width:18px; height:18px; color:var(--muted); }
.list-item .chev { width:15px; height:15px; color:var(--faint); }

/* Selector segmentado y pestañas. */
.seg { display:flex; gap:4px; padding:4px; background:var(--soft); border-radius:var(--r); }
.seg button {
  flex:1; border:0; background:none; border-radius:var(--r-sm); padding:9px 4px; min-height:44px;
  font-size:12.5px; font-weight:500; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
}
.seg button svg { width:17px; height:17px; }
.seg button.on { background:var(--card); color:var(--ink); font-weight:600; border:1px solid var(--line); }
.tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin:0 0 14px; }
.tabs button {
  border:0; background:none; padding:10px 12px; font-size:14px; font-weight:500; color:var(--muted);
  position:relative; min-height:44px; display:inline-flex; align-items:center; gap:6px;
}
.tabs button.on { color:var(--ink); font-weight:600; }
.tabs button.on::after { content:""; position:absolute; left:8px; right:8px; bottom:-1px; height:2px; background:var(--ink); border-radius:2px 2px 0 0; }
.tabs .cnt { font-size:11px; background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:0 6px; color:var(--muted); }

/* -------------------------------------------------------------- resumen --
   El numero grande manda: la deuda total, con las cifras proporcionales del
   sistema (nada de tabular-nums en un numero suelto). */
.hero { padding:18px 16px 16px; }
.hero .lbl { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
.hero .val { font-size:40px; font-weight:600; letter-spacing:-.03em; line-height:1.1; margin:4px 0 2px; }
.hero .val small { font-size:18px; font-weight:500; color:var(--muted); letter-spacing:0; margin-right:4px; }
.hero .sub { font-size:13px; color:var(--muted); }
.tiles { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
.tile { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 13px; min-width:0; }
.tile .lbl { font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.07em; }
.tile .val { font-size:17px; font-weight:600; letter-spacing:-.02em; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tile .val.good { color:var(--ok); }
.tile .val.bad { color:var(--bad); }

/* Tarjeta de deuda en el resumen. */
.debt-card { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; color:var(--ink); margin-bottom:10px; }
.debt-card:hover { border-color:var(--line-2); background:var(--soft); }
.debt-card .top { display:flex; align-items:center; gap:10px; }
.debt-card .kind { width:36px; height:36px; border-radius:10px; background:var(--soft); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--muted); flex:none; }
.debt-card .kind svg { width:18px; height:18px; }
.debt-card .name { font-weight:600; font-size:15.5px; }
.debt-card .who { font-size:12.5px; color:var(--faint); }
.debt-card .bal { text-align:right; }
.debt-card .bal b { display:block; font-size:17px; font-weight:600; letter-spacing:-.02em; }
.debt-card .bal small { font-size:11.5px; color:var(--faint); }
.debt-card .meter { margin-top:12px; height:6px; border-radius:3px; background:var(--soft); border:1px solid var(--line); overflow:hidden; }
.debt-card .meter i { display:block; height:100%; background:var(--s3); border-radius:3px; }
.debt-card .foot { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:6px; }

/* ----------------------------------------------------------- movimientos */
.entry { display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line); width:100%; background:var(--card); border-left:0; border-right:0; border-top:0; text-align:left; color:var(--ink); }
.entry:last-child { border-bottom:0; }
.entry:hover { background:var(--soft); }
.entry .dir { width:34px; height:34px; border-radius:999px; display:flex; align-items:center; justify-content:center; flex:none; border:1px solid var(--line); }
.entry .dir svg { width:16px; height:16px; }
.entry .dir.loan { background:var(--bad-bg); border-color:var(--bad-line); color:var(--bad); }
.entry .dir.payment { background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok); }
.entry .what { font-weight:500; font-size:15px; }
.entry .when { font-size:12.5px; color:var(--faint); display:flex; gap:8px; align-items:center; }
.entry .when svg { width:13px; height:13px; }
.entry .amt { text-align:right; font-weight:600; font-size:15.5px; letter-spacing:-.01em; white-space:nowrap; }
.entry .amt.loan { color:var(--bad); }
.entry .amt.payment { color:var(--ok); }
.entry .amt small { display:block; font-weight:400; font-size:11.5px; color:var(--faint); letter-spacing:0; }
.month-head { font-size:11px; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.09em; padding:14px 16px 6px; background:var(--card); border-bottom:1px solid var(--line); }

.receipt-view { width:100%; border:1px solid var(--line); border-radius:var(--r); background:#fff; display:block; }
.receipt-drop { border:1px dashed var(--line-2); border-radius:var(--r); padding:18px; text-align:center; color:var(--muted); font-size:13.5px; cursor:pointer; background:var(--soft); }
.receipt-drop:hover { border-color:var(--ink); color:var(--ink); }
.receipt-drop svg { width:22px; height:22px; margin-bottom:6px; }
.receipt-thumb { position:relative; }
.receipt-thumb img { width:100%; max-height:240px; object-fit:contain; border:1px solid var(--line); border-radius:var(--r); background:#fff; display:block; }
.receipt-thumb .btn { position:absolute; right:8px; top:8px; }

/* Botones de accion de la deuda (prestamo / abono). */
.actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }

/* ------------------------------------------------------------ comentarios */
.cmt { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--card); }
.cmt:last-child { border-bottom:0; }
.cmt .head { display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--faint); margin-bottom:3px; }
.cmt .head b { color:var(--ink); font-weight:600; }
.cmt .head .del { margin-left:auto; background:none; border:0; color:var(--faint); padding:4px; display:flex; }
.cmt .head .del svg { width:14px; height:14px; }
.cmt .head .del:hover { color:var(--bad); }
.cmt .text { white-space:pre-wrap; word-break:break-word; font-size:14.5px; }
.cmt .ctx { font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:5px; align-items:center; }
.cmt .ctx svg { width:12px; height:12px; }
.compose { display:flex; gap:8px; align-items:flex-end; padding:12px 16px; background:var(--card); border-top:1px solid var(--line); }
.compose textarea { flex:1; min-height:44px; max-height:120px; padding:10px 12px; border:1px solid var(--line-2); border-radius:var(--r-sm); background:var(--card); resize:none; line-height:1.4; font-size:14.5px; }
.compose textarea:focus { outline:none; border-color:var(--ink); box-shadow:0 0 0 3px var(--line); }
.compose .btn { min-height:44px; padding:0 14px; }

/* ---------------------------------------------------------------- graficos --
   Lineas de 2px, rejilla hairline solida y marcadores con anillo del color de
   la superficie. El tooltip lo pone la app, el SVG solo sabe de posiciones. */
.chart-box { position:relative; }
.chart-box svg { width:100%; height:auto; display:block; overflow:visible; }
.chart-box .grid line { stroke:var(--grid); stroke-width:1; }
.chart-box .axis line { stroke:var(--axis); stroke-width:1; }
.chart-box text { fill:var(--muted); font-size:11px; font-family:inherit; font-variant-numeric:tabular-nums; }
.chart-box text.lbl { fill:var(--ink); font-weight:600; font-size:11.5px; }
.chart-box .ln { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.chart-box .dot { stroke:var(--card); stroke-width:2; }
.chart-box .bar { rx:0; }
.chart-box .hit { fill:transparent; }
.chart-box .cross { stroke:var(--axis); stroke-width:1; pointer-events:none; }
.chart-box .hover-dot { stroke:var(--card); stroke-width:2; pointer-events:none; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin:4px 0 10px; }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.legend i { width:14px; height:3px; border-radius:2px; display:inline-block; }
.legend i.sq { width:10px; height:10px; border-radius:2px; }
.tip {
  position:absolute; z-index:5; pointer-events:none; background:var(--card); border:1px solid var(--line-2);
  border-radius:var(--r-sm); padding:8px 10px; font-size:12.5px; box-shadow:var(--shadow); min-width:120px;
  transform:translate(-50%, 0); white-space:nowrap;
}
.tip .t { color:var(--faint); font-size:11.5px; margin-bottom:3px; }
.tip .r { display:flex; align-items:center; gap:7px; justify-content:space-between; }
.tip .r i { width:10px; height:3px; border-radius:2px; display:inline-block; }
.tip .r b { font-variant-numeric:tabular-nums; }
.tip .r span { color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
.chart-title { font-size:13.5px; font-weight:600; margin:0 0 2px; }
.chart-sub { font-size:12px; color:var(--faint); margin:0 0 10px; }
.tbl { width:100%; border-collapse:collapse; font-size:13.5px; }
.tbl th, .tbl td { padding:9px 8px; border-bottom:1px solid var(--line); text-align:right; }
.tbl th:first-child, .tbl td:first-child { text-align:left; }
.tbl th { font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--faint); font-weight:600; }
.tbl td { color:var(--muted); font-variant-numeric:tabular-nums; }
.tbl td:first-child { color:var(--ink); font-weight:500; }

.tbl tfoot td { font-weight:600; color:var(--ink); border-top:1px solid var(--line-2); border-bottom:0; }
.scroll-x { overflow-x:auto; -webkit-overflow-scrolling:touch; }
details.plain summary { cursor:pointer; padding:12px 16px; font-weight:500; list-style:none; display:flex; align-items:center; gap:8px; }

details.plain summary svg { width:15px; height:15px; color:var(--faint); transition:transform .15s; }

/* -------------------------------------------------------------- simulador */

.scen .x svg { width:15px; height:15px; }

/* --------------------------------------------------------- ficha de usuario */
/* --------------------------------------------------------------- gastos --
   Fila de categoria: nombre, monto y una barra que compara con la categoria
   mas alta del mes (o con su propio tope si lo tiene). */
/* Cuentas del mes: entro / salio / queda. Una fila por linea, el total con

.flow-row { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:6px 0; font-size:14.5px; }
.flow-row span { color:var(--muted); }

/* Lo que cubrio un mantenimiento: etiquetas chiquitas bajo el titulo. */

.me-row { display:flex; align-items:center; gap:13px; padding:16px; background:var(--card); }
.avatar { width:44px; height:44px; border-radius:999px; background:var(--ink); color:var(--on-ink); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:16px; flex:none; }

.modal .sheet { background:var(--bg); width:100%; max-height:90vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:18px 16px calc(24px + env(safe-area-inset-bottom)); }

  .modal { align-items:center; justify-content:center; padding:20px; }
  .modal .sheet { max-width:520px; border-radius:14px; max-height:88vh; }

@keyframes pop { from { transform:scale(.96); opacity:0; } to { transform:scale(1); opacity:1; } }
.dlg-box h3 { margin:0 0 7px; font-size:16.5px; font-weight:600; color:var(--ink); text-transform:none; letter-spacing:-.015em; }

.toast {

  max-width:calc(100% - 32px); padding:11px 17px; border-radius:999px; font-size:14px; font-weight:500;
  color:var(--on-ink); background:var(--ink); box-shadow:var(--shadow); animation:pop .13s ease-out; display:flex; align-items:center; gap:8px;

@media (max-width:400px) {

  header.top { padding-left:12px; padding-right:12px; }

  *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
}

<script>
/* ===========================================================================
   Estado y utilidades
   =========================================================================== */
/* --------------------------------- fechas --------------------------------
   Todo usa la hora de NICARAGUA (America/Managua, UTC-6 todo el año), igual
   que el servidor: "hoy" significa lo mismo para quien presta y quien debe.
-------------------------------------------------------------------------- */
const TZ_APP = "America/Managua";
const dayFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ_APP, year: "numeric", month: "2-digit", day: "2-digit" });
const todayApp = () => dayFmt.format(new Date());
const ymd = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
const toDate = (day) => { const [y, m, d] = day.split("-").map(Number); return new Date(y, m - 1, d); };
const shiftDays = (day, n) => { const d = toDate(day); d.setDate(d.getDate() + n); return ymd(d); };
const shiftMonths = (day, n) => {
  const d = toDate(day); const dia = d.getDate();
  d.setDate(1); d.setMonth(d.getMonth() + n);
  // Si el mes destino es mas corto (31 -> feb), se queda en el ultimo dia.
  const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(dia, ult));
  return ymd(d);
};
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const MESES_L = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const monthKey = (day) => day.slice(0, 7);
const monthLabel = (k) => { const [y, m] = k.split("-").map(Number); return `${MESES[m - 1]} ${String(y).slice(2)}`; };
const monthLong = (k) => { const [y, m] = k.split("-").map(Number); return `${MESES_L[m - 1]} ${y}`; };
// Los ultimos n meses (YYYY-MM), terminando en el actual.
function lastMonths(n) {
  const [y, m] = todayApp().split("-").map(Number);
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(y, m - 1 - i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }
  return out;
}
function prettyDay(day, { year = false } = {}) {
  if (!day) return "—";
  const d = toDate(day);
  return d.toLocaleDateString("es", { day: "numeric", month: "short", ...(year ? { year: "numeric" } : {}) }).replace(".", "");
}
const prettyDayLong = (day) => toDate(day).toLocaleDateString("es", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
function fechaHora(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "—";
  return d.toLocaleString("es-NI", { timeZone: TZ_APP, day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }).replace(".", "");
}
// Diferencia en dias entre dos YYYY-MM-DD.
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);

/* --------------------------------- dinero -------------------------------- */
const CUR = {
  NIO: { sym: "C$", label: "córdobas", short: "C$" },
  USD: { sym: "US$", label: "dólares", short: "US$" },
};
const nfMoney = new Intl.NumberFormat("es-NI", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const nf2 = new Intl.NumberFormat("es-NI", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n, cur = "NIO") => {
  const v = Number(n) || 0;
  return (v < 0 ? "-" : "") + (CUR[cur]?.sym || "") + nfMoney.format(Math.abs(v) < 0.005 ? 0 : Math.abs(v));
};
const money2 = (n, cur = "NIO") => (CUR[cur]?.sym || "") + nf2.format(Number(n) || 0);
// Para los ejes: 12.5k, 1.2M.
function fmtCompact(n) {
  const v = Number(n) || 0, a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(".0", "") + "M";
  if (a >= 1e3) return (v / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(".0", "") + "k";
  return nfMoney.format(v);
}
const pct = (part, total) => (total > 0 ? Math.min(100, Math.round((part / total) * 100)) : 0);

const S = {
  token: localStorage.getItem("dd_token") || "",
  me: JSON.parse(localStorage.getItem("dd_me") || "null"),
  account: JSON.parse(localStorage.getItem("dd_account") || "null"),
  debtId: Number(localStorage.getItem("dd_debt")) || null,
  view: "home",
  sum: null,            // /api/summary: deudas con totales, movimientos, comentarios
  entries: null,        // movimientos de la deuda abierta (detallados)
  debtTab: "moves",     // moves | chart | comments
  moveFilter: "all",    // all | loan | payment
  homeCur: null,        // moneda que se muestra en el resumen
  debtCur: null,        // moneda que se muestra en la deuda abierta (si tiene varias)
  side: "owe",          // que lado se mira: "owe" lo que debo | "owed" lo que me deben
  spend: null,          // /api/expenses: { categories, expenses, today }
  spendMonth: null,     // mes que se mira en Gastos (YYYY-MM)
  spendCur: null,       // moneda que se muestra en Gastos
  veh: null,            // /api/vehicles: { vehicles, tasks, services }
  vehId: null,          // vehiculo abierto
  recovery: null,
  simScen: null,        // escenarios del simulador (persisten al cambiar de vista)
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : varios}`;
const initials = (name) => (name || "?").trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
const emptyState = (ic, html) => `<div class="empty">${icon(ic)}<div>${html}</div></div>`;
const isAdmin = () => S.me?.role === "admin";
const debtById = (id) => (S.sum?.debts || []).find((d) => d.id === id) || null;
const currentDebt = () => debtById(S.debtId);
// Una deuda puede tener una parte en cordobas y otra en dolares: los saldos van
// por moneda y NUNCA se suman entre si. "C$3,500 + US$250".
const balances = (d, sep = " + ") => d.currencies.map((c) => money(d.totals[c].balance, c)).join(sep);
// Moneda a mostrar de una deuda: la elegida si la tiene, si no la por defecto, si no la primera.
const debtCurOf = (d, pref) => (d.currencies.includes(pref) ? pref : d.currencies.includes(d.currency) ? d.currency : d.currencies[0]);

const KIND_META = {
  person: { label: "Persona", icon: "user" },
  card:   { label: "Tarjeta", icon: "card" },
  other:  { label: "Otra",    icon: "wallet" },
};

/* --------------------------------------------------------------- direccion --
   Un COBRO es una deuda vista desde el otro lado: los mismos movimientos, los
   mismos comprobantes, la misma aritmetica. Lo unico que cambia son las
   palabras, y viven todas aqui para no repartir "si es cobro entonces..." por
   media app.

     owe  -> yo debo:   me prestaron (loan sube), yo abono (payment baja)
     owed -> me deben:  yo preste   (loan sube), me abonan (payment baja)
-------------------------------------------------------------------------- */
const SIDE = {
  owe: {
    tab: "Debo", nueva: "Nueva deuda", cosa: "deuda", cosas: "deudas",
    lista: "Mis deudas", toca: "Lo que toca pagar", chip: "debo",
    pagado: "pagado", loMio: "prestado", deMas: "Abonado",
    hero: "Debo actualmente", heroTotal: "Debo en total", saldada: "Deuda saldada",
    loan: "Préstamo", loanPlural: "Préstamos", payment: "Abono", paymentPlural: "Abonos",
    loaned: "Prestado", paid: "Abonado", pending: "Por pagar",
    quien: "¿Con quién es la deuda?", quienPh: "Mi hermano, Tarjeta Amex…",
    otro: "Nombre de la persona o banco (opcional)",
    ayudaNueva: "Aquí solo dices <b>con quién</b> es la deuda. <b>No necesitas saber el monto</b>: se va sumando solo con cada préstamo que registres dentro, y baja con cada abono.",
    vacioAdmin: "Todavía no tienes ninguna deuda registrada.<br>Crea la primera: con tu hermano, una tarjeta, lo que sea.",
    vacioNuevo: "Crear una deuda", primerMov: "Registrar el primer préstamo",
    sinMovs: "Todavía no hay nada registrado.<br>Ve cargando los préstamos que te han hecho, uno por uno: el saldo se calcula solo.",
    acuerdo: "Acuerdo de pago", acuerdoAyuda: "Si quedaste en abonar cada tanto, ponlo aquí y la app te avisa cuándo toca.",
  },
  owed: {
    tab: "Me deben", nueva: "Nuevo cobro", cosa: "cobro", cosas: "cobros",
    lista: "Lo que me deben", toca: "Lo que toca cobrar", chip: "me deben",
    pagado: "cobrado", loMio: "que presté", deMas: "Pagado",
    hero: "Me deben actualmente", heroTotal: "Me deben en total", saldada: "Cobro saldado",
    loan: "Préstamo que hice", loanPlural: "Lo que presté", payment: "Pago recibido", paymentPlural: "Pagos recibidos",
    loaned: "Presté", paid: "Me han pagado", pending: "Por cobrar",
    quien: "¿Quién me debe?", quienPh: "Mi primo Carlos, don Luis…",
    otro: "Nombre completo o dato de contacto (opcional)",
    ayudaNueva: "Aquí solo dices <b>quién te debe</b>. <b>No necesitas saber el monto</b>: se va sumando con cada préstamo que registres, y baja con cada pago que recibas.",
    vacioAdmin: "Todavía no tienes ningún cobro registrado.<br>Anota lo que te deben: un préstamo que hiciste, un trabajo sin pagar.",
    vacioNuevo: "Registrar un cobro", primerMov: "Registrar el primer préstamo",
    sinMovs: "Todavía no hay nada registrado.<br>Ve cargando lo que le prestaste, uno por uno: el saldo se calcula solo.",
    acuerdo: "Acuerdo de cobro", acuerdoAyuda: "Si quedaron en que te pague cada tanto, ponlo aquí y la app te avisa cuándo toca.",
  },
};
const dirOf = (d) => (d?.direction === "owed" ? "owed" : "owe");
const flipDir = (x) => (x === "owed" ? "owe" : "owed");

/* Y ahora lo importante: la MISMA deuda se cuenta al reves segun quien mire.

   El dueño registra "le debo a mi hermano C$3,500". Su hermano, cuando entra a
   verla, es el acreedor: para el eso es "me deben C$3,500", lo que presto y lo
   que le han pagado. No son dos deudas ni dos registros: es la misma fila leida
   desde el otro lado.

   Por eso el vocabulario no depende solo de `direction`, sino de quien esta
   mirando. El dueño ve la direccion tal cual; a un usuario de solo lectura se
   le invierte. (Los cobros del dueño ni le llegan, ver lib/auth.js.) */
const wordSide = (d) => (isAdmin() ? dirOf(d) : flipDir(dirOf(d)));
const T = (d) => SIDE[wordSide(d)];
const sideOf = () => SIDE[isAdmin() ? S.side : flipDir(S.side)];
const debtsOf = (side) => (S.sum?.debts || []).filter((d) => dirOf(d) === side);

/* ------------------------------------------------------------ recordatorio --
   Con un acuerdo de pago cargado ("cada mes, C$500, desde el 15"), se calcula
   la fecha que TOCA ahora: la primera del acuerdo que sea posterior al ultimo
   pago recibido (o la primera de todas, si no hay ninguno). Si esa fecha ya
   paso, esta vencido y se dice por cuantos dias.

   No hay notificaciones push a proposito: una PWA no las tiene garantizadas en
   iPhone y dependerian de un servicio aparte. El aviso vive en la pantalla y
   se manda por WhatsApp, que es como se cobra de verdad.
-------------------------------------------------------------------------- */
const DUE_LABEL = { weekly: "Cada semana", biweekly: "Cada quincena", monthly: "Cada mes" };
function nextDue(d) {
  if (!d.dueEvery || !d.dueAmount || !d.dueFrom) return null;
  const bal = d.currencies.reduce((a, c) => a + Math.max(0, d.totals[c].balance), 0);
  if (bal <= 0) return null;                       // saldado: no hay nada que recordar
  const hoy = todayApp();
  const desde = d.lastPaymentDay && d.lastPaymentDay > d.dueFrom ? d.lastPaymentDay : null;
  let day = d.dueFrom, i = 0;
  // Se avanza hasta pasar el ultimo pago (o hasta hoy si nunca pago).
  while (i++ < 600 && day <= (desde || shiftDays(hoy, -1))) {
    day = d.dueEvery === "monthly" ? shiftMonths(d.dueFrom, i) : shiftDays(d.dueFrom, (d.dueEvery === "weekly" ? 7 : 14) * i);
  }
  const dias = daysBetween(hoy, day);
  return { day, dias, vencido: dias < 0, amount: d.dueAmount, currency: d.currency };
}
function dueText(due) {
  if (!due) return "";
  if (due.vencido) return `Atrasado ${plural(-due.dias, "día", "días")}`;
  if (due.dias === 0) return "Toca hoy";
  if (due.dias === 1) return "Toca mañana";
  if (due.dias <= 7) return `Toca en ${plural(due.dias, "día", "días")}`;
  return `Toca el ${prettyDay(due.day)}`;
}

function applyTheme(t) {
  const pref = THEMES.some((x) => x[0] === t) ? t : "auto";
  localStorage.setItem("dd_theme", pref);
  if (pref === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", pref);
  const dark = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelector('meta[name="theme-color"]').content = dark ? "#0d0d0f" : "#ffffff";
}

/* --------------------------------- API ---------------------------------- */
async function api(path, { method = "GET", body } = {}) {
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: {
        ...(body ? { "content-type": "application/json" } : {}),
        ...(S.token ? { "x-session-token": S.token } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    throw new Error("Sin conexión. Revisa tu internet e intenta de nuevo.");
  }
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && S.token) { logout(); throw new Error("Sesión expirada. Vuelve a entrar."); }
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

let toastTimer = null;
function toast(text, kind = "ok") {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const el = document.createElement("div");
  el.className = `toast ${kind === "err" ? "err" : ""}`;
  el.setAttribute("role", "status");
  el.innerHTML = icon(kind === "err" ? "info" : "check") + `<span>${esc(text)}</span>`;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), kind === "err" ? 4000 : 2600);
}

// Pregunta de si/no. Reemplaza a confirm(): el nativo se ve mal en el celular y
// congela la pagina entera mientras esta abierto.
function ask({ title, text = "", ok = "Aceptar", cancel = "Cancelar", danger = false }) {
  return new Promise((resolve) => {
    const root = $("dialogRoot");
    root.innerHTML = `
      <div class="modal dlg" role="dialog" aria-modal="true">
        <div class="dlg-box">
          <h3>${esc(title)}</h3>
          ${text ? `<p>${esc(text)}</p>` : ""}
          <div class="dlg-actions">
            <button class="btn" data-r="0">${esc(cancel)}</button>
            <button class="btn ${danger ? "solid-danger" : "primary"}" data-r="1">${esc(ok)}</button>
          </div>
        </div>
      </div>`;
    const done = (v) => { document.removeEventListener("keydown", onKey); root.innerHTML = ""; resolve(v); };
    const onKey = (e) => { if (e.key === "Escape") done(false); else if (e.key === "Enter") done(true); };
    document.addEventListener("keydown", onKey);
    root.querySelectorAll("[data-r]").forEach((b) => b.addEventListener("click", () => done(b.dataset.r === "1")));
    root.querySelector(".modal").addEventListener("click", (e) => { if (e.target.classList.contains("modal")) done(false); });
    root.querySelector('[data-r="1"]').focus();
  });
}

function openModal(html) {
  $("modalRoot").innerHTML = `
    <div class="modal">
      <div class="sheet">
        <button class="btn sm" id="modalClose" style="float:right; margin-left:10px;">Cerrar</button>

}

async function start() {
  $("meBtn").textContent = initials(S.me?.fullName || S.me?.name);
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  document.body.classList.remove("no-nav");
  // Gastos del hogar es solo del dueño: al de solo lectura ni le aparece la
  // pestaña (y el servidor le contesta 403 si la pide a mano).
  document.querySelectorAll("nav.bottom button[data-admin]").forEach((b) => b.classList.toggle("hidden", !isAdmin()));
  if (!isAdmin() && S.view === "spend") S.view = "home";
  await refresh();
  setView(S.view);
}

// Vuelve a pedir el resumen (deudas, movimientos, comentarios). Es la unica
// fuente de verdad de la app: despues de cualquier cambio se llama a esto.
async function refresh() {
  try {
    S.sum = await api("/api/summary");
  } catch (err) {
    if (!S.sum) $("homeBody").innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
    throw err;
  }
  const debts = S.sum.debts;
  if (!debts.some((d) => d.id === S.debtId)) S.debtId = debts[0]?.id || null;
  if (S.debtId) localStorage.setItem("dd_debt", S.debtId); else localStorage.removeItem("dd_debt");
  // El lado que se mira arranca donde haya algo (si no debo nada, en "me deben").
  if (!debtsOf(S.side).some((d) => d.active)) {
    const otro = S.side === "owe" ? "owed" : "owe";
    if (debtsOf(otro).some((d) => d.active)) S.side = otro;
  }
  refreshCur();
  paintHeader();
}

}

/* ===========================================================================
   Series para los graficos (a partir de los movimientos crudos del resumen)
   =========================================================================== */
// Saldo al cierre de cada mes: todo lo prestado menos todo lo abonado hasta ahi.
function balanceByMonth(entries, months) {
  return months.map((m) => entries.reduce((acc, e) => (monthKey(e.day) <= m ? acc + (e.kind === "loan" ? e.amount : -e.amount) : acc), 0));
}
// Cuanto se presto y cuanto se abono en cada mes.
function flowsByMonth(entries, months) {
  const loan = months.map(() => 0), payment = months.map(() => 0);
  for (const e of entries) {
    const i = months.indexOf(monthKey(e.day));
    if (i < 0) continue;
    (e.kind === "loan" ? loan : payment)[i] += e.amount;
  }
  return { loan, payment };
}

/* ===========================================================================
   Graficos en SVG, sin librerias.

   Marcas finas (lineas de 2px, barras de <=24px con la punta redondeada),
   rejilla hairline solida, ejes recesivos y un solo eje Y. El hover lo lleva
   una capa transparente: al pasar el dedo se marca la posicion mas cercana y
   se muestran TODAS las series en un tooltip. Cada grafico tiene su tabla
   gemela (details) para leerlo sin color y sin hover.
   =========================================================================== */
// Ticks "bonitos" del eje Y: 0, 1000, 2000... segun el maximo.
function niceTicks(max, n = 4) {
  if (max <= 0) return [0, 1, 2, 3, 4].map((i) => i * 0.25);
  const raw = max / n;
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((s) => s >= raw) || raw;
  const ticks = [];
  for (let v = 0; v <= max + step * 0.001; v += step) ticks.push(v);
  if (ticks[ticks.length - 1] < max) ticks.push(ticks[ticks.length - 1] + step);
  return ticks;
}
// Indices de etiquetas X que caben (a lo sumo `max`), siempre la primera y la ultima.
function pickLabels(n, max = 6) {
  if (n <= max) return [...Array(n).keys()];
  const step = Math.ceil((n - 1) / (max - 1));
  const out = [];
  for (let i = 0; i < n; i += step) out.push(i);
  // La ultima etiqueta siempre va; si la anterior le queda encima, se quita.
  if (out[out.length - 1] !== n - 1) {
    if (n - 1 - out[out.length - 1] < step / 2) out.pop();
    out.push(n - 1);
  }
  return out;
}
const legendHtml = (series, shape = "ln") => series.length < 2 ? "" :
  `<div class="legend">${series.map((s) => `<span><i class="${shape === "sq" ? "sq" : ""}" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`;

// Grafico de lineas. series: [{ name, color, values[] }], labels: texto de cada X.
function lineChart(el, { series, labels, fmt = fmtCompact, fmtFull = (v) => nfMoney.format(v), height = 200 }) {
  const W = 600, H = height, ML = 46, MR = 14, MT = 12, MB = 26;
  const n = labels.length;
  const max = Math.max(0, ...series.flatMap((s) => s.values.filter((v) => v != null)));
  const ticks = niceTicks(max);
  const top = ticks[ticks.length - 1] || 1;
  const x = (i) => ML + (n > 1 ? (i / (n - 1)) * (W - ML - MR) : (W - ML - MR) / 2);
  const y = (v) => MT + (1 - v / top) * (H - MT - MB);
  const path = (vals) => {
    let d = "", pen = false;
    vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)} `; pen = true; });
    return d;
  };
  const lastIdx = (vals) => { for (let i = vals.length - 1; i >= 0; i--) if (vals[i] != null) return i; return -1; };
  const lbls = pickLabels(n);
  el.innerHTML = `${legendHtml(series)}
    <div class="chart-box">
    <svg viewBox="0 0 ${W} ${H}" role="img">
      <g class="grid">${ticks.map((t) => `<line x1="${ML}" x2="${W - MR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`).join("")}</g>
      <g class="axis"><line x1="${ML}" x2="${W - MR}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/></g>
      ${ticks.map((t) => `<text x="${ML - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${esc(fmt(t))}</text>`).join("")}
      ${lbls.map((i) => `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 && n > 1 ? "start" : i === n - 1 && n > 1 ? "end" : "middle"}">${esc(labels[i])}</text>`).join("")}
      ${series.map((s) => `<path class="ln" d="${path(s.values)}" stroke="${s.color}"/>`).join("")}
      ${series.map((s) => { const i = lastIdx(s.values); return i < 0 ? "" : `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(s.values[i]).toFixed(1)}" r="4" fill="${s.color}"/>`; }).join("")}
      <g class="hov"></g>
      <rect class="hit" x="${ML}" y="0" width="${W - ML - MR}" height="${H}"/>
    </svg>
    <div class="tip hidden"></div>
    </div>`;
  attachHover(el, { n, x, y: (i, s) => y(s.values[i]), series, labels, fmtFull, W, ML, MR, H, MT, MB });
}

// Barras agrupadas. series: [{ name, color, values[] }].
function barChart(el, { series, labels, fmt = fmtCompact, fmtFull = (v) => nfMoney.format(v), height = 200 }) {
  const W = 600, H = height, ML = 46, MR = 14, MT = 12, MB = 26;
  const n = labels.length;
  const max = Math.max(0, ...series.flatMap((s) => s.values));
  const ticks = niceTicks(max);
  const top = ticks[ticks.length - 1] || 1;
  const band = (W - ML - MR) / n;
  const y = (v) => MT + (1 - v / top) * (H - MT - MB);
  const bw = Math.min(24, Math.max(3, (band * 0.7 - 2 * (series.length - 1)) / series.length));
  const groupW = bw * series.length + 2 * (series.length - 1);
  const x0 = (i) => ML + band * i + (band - groupW) / 2;
  const lbls = pickLabels(n);
  // Barra con la punta redondeada (4px) y la base cuadrada, pegada a la linea cero.
  const bar = (bx, v, color) => {
    const h = y(0) - y(v);
    if (h <= 0) return "";
    const r = Math.min(4, h, bw / 2);
    const yt = y(v);
    return `<path class="bar" fill="${color}" d="M${bx.toFixed(1)},${y(0).toFixed(1)} V${(yt + r).toFixed(1)} Q${bx.toFixed(1)},${yt.toFixed(1)} ${(bx + r).toFixed(1)},${yt.toFixed(1)} H${(bx + bw - r).toFixed(1)} Q${(bx + bw).toFixed(1)},${yt.toFixed(1)} ${(bx + bw).toFixed(1)},${(yt + r).toFixed(1)} V${y(0).toFixed(1)} Z"/>`;
  };
  el.innerHTML = `${legendHtml(series, "sq")}
    <div class="chart-box">
    <svg viewBox="0 0 ${W} ${H}" role="img">
      <g class="grid">${ticks.map((t) => `<line x1="${ML}" x2="${W - MR}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`).join("")}</g>
      ${ticks.map((t) => `<text x="${ML - 8}" y="${(y(t) + 3.5).toFixed(1)}" text-anchor="end">${esc(fmt(t))}</text>`).join("")}
      ${lbls.map((i) => `<text x="${(ML + band * i + band / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(labels[i])}</text>`).join("")}
      ${series.map((s, k) => s.values.map((v, i) => bar(x0(i) + k * (bw + 2), v, s.color)).join("")).join("")}
      <g class="axis"><line x1="${ML}" x2="${W - MR}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/></g>
      <g class="hov"></g>
      <rect class="hit" x="${ML}" y="0" width="${W - ML - MR}" height="${H}"/>
    </svg>
    <div class="tip hidden"></div>
    </div>`;
  attachHover(el, { n, x: (i) => ML + band * i + band / 2, y: null, series, labels, fmtFull, W, ML, MR, H, MT, MB, bandW: band });
}

// Capa de hover comun: crosshair (o resaltado de la banda) + tooltip con todas
// las series en esa X. Funciona con dedo y con raton.
function attachHover(el, { n, x, y, series, labels, fmtFull, W, ML, MR, H, MT, MB, bandW = 0 }) {
  const box = el.querySelector(".chart-box"), svg = box.querySelector("svg"), hov = svg.querySelector(".hov"), tip = box.querySelector(".tip"), hit = svg.querySelector(".hit");
  const show = (i) => {
    const px = x(i);
    hov.innerHTML = bandW
      ? `<rect x="${(px - bandW / 2).toFixed(1)}" y="${MT}" width="${bandW.toFixed(1)}" height="${H - MT - MB}" fill="currentColor" opacity=".06"/>`
      : `<line class="cross" x1="${px.toFixed(1)}" x2="${px.toFixed(1)}" y1="${MT}" y2="${H - MB}"/>` +
        series.map((s) => s.values[i] == null ? "" : `<circle class="hover-dot" cx="${px.toFixed(1)}" cy="${y(i, s).toFixed(1)}" r="5" fill="${s.color}"/>`).join("");
    tip.innerHTML = `<div class="t">${esc(labels[i])}</div>` + series.map((s) =>
      `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><b>${s.values[i] == null ? "—" : esc(fmtFull(s.values[i]))}</b></div>`).join("");
    tip.classList.remove("hidden");
    // Posicion en pixeles reales (el SVG escala con el ancho).
    const rect = svg.getBoundingClientRect(), scale = rect.width / W;
    let left = px * scale;
    const tw = tip.offsetWidth;
    left = Math.max(tw / 2 + 2, Math.min(rect.width - tw / 2 - 2, left));
    tip.style.left = left + "px";
    tip.style.top = Math.max(0, MT * scale - 6) + "px";
  };
  const hide = () => { hov.innerHTML = ""; tip.classList.add("hidden"); };
  const onMove = (e) => {
    const rect = svg.getBoundingClientRect();
    const vx = ((e.clientX - rect.left) / rect.width) * W;
    let best = 0, bd = Infinity;
    for (let i = 0; i < n; i++) { const d = Math.abs(x(i) - vx); if (d < bd) { bd = d; best = i; } }
    show(best);
  };
  hit.addEventListener("pointermove", onMove);
  hit.addEventListener("pointerdown", onMove);
  hit.addEventListener("pointerleave", hide);
}

// Tabla gemela de un grafico (se pliega): la misma informacion sin color ni hover.
function chartTable(labels, series, fmtFull = (v) => nfMoney.format(v), title = "Ver como tabla") {
  return `
    <details class="plain card" style="margin-top:10px;">
      <summary>${icon("chevron")}${esc(title)}</summary>
      <div class="scroll-x"><table class="tbl">
        <thead><tr><th></th>${series.map((s) => `<th>${esc(s.name)}</th>`).join("")}</tr></thead>
        <tbody>${labels.map((l, i) => `<tr><td>${esc(l)}</td>${series.map((s) => `<td>${s.values[i] == null ? "—" : esc(fmtFull(s.values[i]))}</td>`).join("")}</tr>`).join("")}</tbody>
      </table></div>
    </details>`;
}
const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];

function renderHome() {
  if (!S.sum) return;
  const body = $("homeBody");
  const t = sideOf();
  const delLado = debtsOf(S.side);
  const debts = delLado.filter((d) => d.active);
  const closed = delLado.filter((d) => !d.active);
  // Las pestañas Debo / Me deben son solo del dueño: a quien entra de solo
  // lectura se le comparte su deuda y nada mas, asi que ni las ve (y el
  // servidor tampoco le manda los cobros).
  const tabs = isAdmin() ? `
    <div class="tabs" id="sideTabs" style="margin-top:14px;">
      ${["owe", "owed"].map((k) => {
        const n = debtsOf(k).filter((d) => d.active).length;
        return `<button data-side="${k}" class="${S.side === k ? "on" : ""}">${SIDE[k].tab}${n ? ` <span class="cnt">${n}</span>` : ""}</button>`;
      }).join("")}
    </div>` : "";
  const pintaTabs = () => $("sideTabs")?.querySelectorAll("[data-side]").forEach((b) =>
    b.addEventListener("click", () => { S.side = b.dataset.side; S.homeCur = null; refreshCur(); renderHome(); }));

  if (!debts.length) {
    body.innerHTML = tabs + (isAdmin()
      ? `<div class="card" style="margin-top:14px;">${emptyState("wallet", t.vacioAdmin)}
           <div class="pad" style="padding-top:0;"><button class="btn primary wide" id="homeNew">${icon("plus")}${t.vacioNuevo}</button></div></div>`
      : `<div class="card" style="margin-top:14px;">${emptyState("eye", `Todavía no te compartieron ninguna ${t.cosa}.<br>Cuando lo hagan, aparecerá aquí.`)}</div>`);
    pintaTabs();
    $("homeNew")?.addEventListener("click", () => debtForm(null));
    return;
  }

  const curs = [...new Set(debts.flatMap((d) => d.currencies))];
  if (curs.includes("NIO") && curs.includes("USD")) curs.sort((a) => (a === "NIO" ? -1 : 1));
  const cur = curs.includes(S.homeCur) ? S.homeCur : curs[0];
  // Las deudas que tienen algo en esta moneda (una deuda puede estar en las dos).
  const mine = debts.filter((d) => d.totals[cur]);
  const tot = mine.reduce((a, d) => ({ loaned: a.loaned + d.totals[cur].loaned, paid: a.paid + d.totals[cur].paid, balance: a.balance + d.totals[cur].balance }), { loaned: 0, paid: 0, balance: 0 });
  const months = lastMonths(12);
  const enCur = S.sum.entries.filter((e) => e.currency === cur);
  const entriesOf = (d) => enCur.filter((e) => e.debtId === d.id);
  // Una linea por deuda si son pocas (el color sigue a la deuda); si no, el total.
  const series = mine.length >= 2 && mine.length <= 4
    ? mine.map((d, i) => ({ name: d.name, color: SERIES[i], values: balanceByMonth(entriesOf(d), months) }))
    : [{ name: "Saldo total", color: SERIES[0], values: balanceByMonth(enCur.filter((e) => mine.some((d) => d.id === e.debtId)), months) }];
  const labels = months.map(monthLabel);
  const hayMovs = enCur.some((e) => mine.some((d) => d.id === e.debtId));

  const card = (d) => {
    const c = debtCurOf(d, cur), tt = d.totals[c];
    const saldada = d.entries > 0 && d.currencies.every((k) => d.totals[k].balance <= 0);
    const due = nextDue(d);
    return `
    <button class="debt-card" data-debt="${d.id}">
      <div class="top">
        <div class="kind">${icon(KIND_META[d.kind]?.icon || "wallet")}</div>
        <div class="grow">
          <div class="name ellip">${esc(d.name)}</div>
          <div class="who ellip">${esc(d.counterpart || KIND_META[d.kind]?.label || "")}${d.lastDay ? ` · último mov. ${prettyDay(d.lastDay)}` : " · sin movimientos"}</div>
        </div>
        <div class="bal">${d.currencies.map((k) => `<b>${money(Math.max(0, d.totals[k].balance), k)}</b>`).join("")}<small>${saldada ? "saldada" : t.chip}</small></div>
      </div>
      <div class="meter"><i style="width:${pct(tt.paid, tt.loaned)}%"></i></div>
      <div class="foot"><span>${t.loaned} ${money(tt.loaned, c)}</span><span>${t.paid} ${money(tt.paid, c)} · ${pct(tt.paid, tt.loaned)}%</span></div>
      ${due ? `<div class="foot" style="margin-top:7px;"><span class="badge ${due.vencido ? "off" : due.dias <= 7 ? "warn" : ""}">${icon("calendar")} ${dueText(due)} · ${money(due.amount, due.currency)}</span></div>` : ""}
    </button>`;
  };

  // Lo que toca pagar (o cobrar) pronto, arriba de todo: es lo unico que hay
  // que hacer algo al respecto. Solo el dueño: al viewer no le llega el acuerdo
  // de pago desde el servidor, asi que nextDue() le da null igual.
  const pendientes = isAdmin()
    ? debts.map((d) => ({ d, due: nextDue(d) })).filter((x) => x.due && x.due.dias <= 7).sort((a, b) => a.due.dias - b.due.dias)
    : [];

  body.innerHTML = tabs + `
    ${curs.length > 1 ? `<div class="chips" style="margin:14px 0 0;">${curs.map((c) => `<button class="chip ${c === cur ? "on" : ""}" data-cur="${c}">${CUR[c].sym} ${CUR[c].label}</button>`).join("")}</div>` : ""}
    <div class="card hero" style="margin-top:14px;">
      <div class="lbl">${t.heroTotal}${curs.length > 1 ? ` (${CUR[cur].label})` : ""}</div>

      <div class="sub">${plural(mine.length, t.cosa, t.cosas)} en ${CUR[cur].label} · ${pct(tot.paid, tot.loaned)}% ${t.pagado} de lo ${t.loMio}</div>
    </div>
    <div class="tiles" style="margin-top:8px;">
      <div class="tile"><div class="lbl">${t.loaned}</div><div class="val">${money(tot.loaned, cur)}</div></div>
      <div class="tile"><div class="lbl">${t.paid}</div><div class="val good">${money(tot.paid, cur)}</div></div>
      <div class="tile"><div class="lbl">${t.pending}</div><div class="val bad">${money(Math.max(0, tot.balance), cur)}</div></div>
    </div>

    ${pendientes.length ? `
    <h3>${t.toca}</h3>
    <div class="card">
      ${pendientes.map(({ d, due }) => `
        <button class="list-item" data-debt="${d.id}">
          ${icon("calendar")}
          <div class="grow">
            <div class="ellip"><b>${esc(d.name)}</b></div>
            <div class="muted">${dueText(due)} · ${prettyDay(due.day, { year: true })}</div>
          </div>
          <b class="num">${money(due.amount, due.currency)}</b>
          ${due.vencido ? '<span class="badge off">atrasado</span>' : ""}
        </button>`).join("")}
    </div>` : ""}

    ${hayMovs ? `
    <div class="card pad" style="margin-top:14px;">
      <p class="chart-title">Cómo ha ido el saldo</p>
      <p class="chart-sub">Últimos 12 meses, al cierre de cada mes · ${CUR[cur].label}</p>
      <div id="homeChart"></div>
      ${chartTable(labels, series)}
    </div>` : ""}

    <div class="sec-head"><h2>${t.lista}</h2>${isAdmin() ? `<button class="btn sm" id="homeNew">${icon("plus")}Nuevo</button>` : ""}</div>
    ${debts.map(card).join("")}
    ${closed.length ? `<p class="muted" style="text-align:center; margin:4px 0 0;"><button class="link" style="font-weight:500; color:var(--muted);" id="homeClosed">Ver ${plural(closed.length, `${t.cosa} cerrada`, `${t.cosas} cerradas`)}</button></p>` : ""}

    ${S.sum.comments.length ? `
    <h3>Últimos comentarios</h3>
    <div class="card">
      ${S.sum.comments.map((c) => `
        <button class="list-item" data-cdebt="${c.debtId}" style="align-items:flex-start;">
          ${icon("chat")}
          <div class="grow">
            <div class="muted" style="margin-bottom:2px;"><b style="color:var(--ink);">${esc(c.userName)}</b> en ${esc(c.debtName)} · ${fechaHora(c.createdAt)}</div>
            <div style="font-size:14.5px; white-space:pre-wrap; word-break:break-word;">${esc(c.text)}</div>
          </div>
        </button>`).join("")}
    </div>` : ""}`;

  if (hayMovs) lineChart($("homeChart"), { series, labels, fmtFull: (v) => money(v, cur) });
  pintaTabs();
  body.querySelectorAll("[data-cur]").forEach((b) => b.addEventListener("click", () => { S.homeCur = b.dataset.cur; renderHome(); }));
  body.querySelectorAll("[data-debt]").forEach((b) => b.addEventListener("click", () => openDebt(Number(b.dataset.debt))));
  body.querySelectorAll("[data-cdebt]").forEach((b) => b.addEventListener("click", () => openDebt(Number(b.dataset.cdebt), "comments")));
  $("homeNew")?.addEventListener("click", () => debtForm(null));
  $("homeClosed")?.addEventListener("click", debtsScreen);
}

async function loadDebt() {
  const d = currentDebt();
  const body = $("debtBody");
  if (!d) {
    body.innerHTML = `<div class="card" style="margin-top:18px;">${emptyState("wallet", isAdmin() ? "No hay nada abierto.<br>Créalo desde el Resumen." : "Todavía no te compartieron nada.")}</div>`;
    return;
  }
  if (!S.entries || S.entries.debtId !== d.id) {
    try {
      const { entries } = await api(`/api/entries?debtId=${d.id}`);
      S.entries = { debtId: d.id, list: entries };
    } catch (err) { body.innerHTML = `<div class="msg err">${esc(err.message)}</div>`; return; }
  }
  renderDebt();
}

// Del mas viejo al mas nuevo (fecha y, a igual fecha, orden de registro).
const cronologico = (list) => [...list].sort((a, b) => (a.day + String(a.id).padStart(9, "0")).localeCompare(b.day + String(b.id).padStart(9, "0")));

// Saldo despues de cada movimiento, llevado POR MONEDA.
function withRunning(list) {
  const bal = {};
  const run = new Map();
  for (const e of cronologico(list)) {
    bal[e.currency] = (bal[e.currency] || 0) + (e.kind === "loan" ? e.amount : -e.amount);
    run.set(e.id, Math.round(bal[e.currency] * 100) / 100);
  }
  return run;
}

  const run = withRunning(list);
  let html = `
    <div class="chips" style="margin-bottom:12px;">
      ${[["all", "Todos"], ["loan", t.loanPlural], ["payment", t.paymentPlural]].map(([k, l]) => `<button class="chip ${f === k ? "on" : ""}" data-f="${k}">${l}</button>`).join("")}
    </div>`;
  if (!shown.length) {
    // Recien creada: se invita a cargar el primer prestamo aqui mismo. El monto
    // total no se pide nunca: sale de sumar lo que se registre.
    const primera = !list.length && isAdmin() && d.active;
    html += `<div class="card">${emptyState("list", list.length ? "Nada con ese filtro." : isAdmin() ? t.sinMovs : "Sin movimientos todavía.")}
      ${primera ? `<div class="pad" style="padding-top:0;"><button class="btn primary wide" id="firstLoan">${icon("up")}${t.primerMov}</button></div>` : ""}</div>`;
  } else {

      html += `
        <button class="entry" data-e="${e.id}">
          <div class="dir ${e.kind}">${icon(e.kind === "loan" ? "up" : "down")}</div>

/* ------------------------------ comprobante ------------------------------
   La captura se achica y se convierte a JPEG en el navegador antes de subirla:
   lo que llega al servidor son unos cientos de KB y no la foto de 4 MB. JPEG a
   proposito: es el unico formato que se puede incrustar tal cual en el PDF. */
const RECEIPT_MAX = 1280;
async function fileToJpeg(file) {
  if (!file.type.startsWith("image/")) throw new Error("Elige una imagen.");
  const uri = await new Promise((ok, fail) => {
    const fr = new FileReader();
    fr.onload = () => ok(fr.result);
    fr.onerror = () => fail(new Error("No se pudo leer el archivo."));
    fr.readAsDataURL(file);
  });
  const img = new Image();
  await new Promise((ok, fail) => { img.onload = ok; img.onerror = () => fail(new Error("No se pudo leer esa imagen.")); img.src = uri; });
  const escala = Math.min(1, RECEIPT_MAX / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(img.width * escala));
  c.height = Math.max(1, Math.round(img.height * escala));
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(img, 0, 0, c.width, c.height);
  // Se baja la calidad hasta que quepa en el tope del servidor.
  for (const q of [0.82, 0.7, 0.6, 0.5]) {
    const out = c.toDataURL("image/jpeg", q);
    if (out.length < 850 * 1024) return out;
  }
  throw new Error("La imagen es demasiado pesada. Prueba con una captura más pequeña.");
}

/* ----------------------------- alta / edicion ---------------------------- */
function entryForm(e) {
  const d = currentDebt();
  if (!d) return;
  const isNew = !e.id;
  const kind = e.kind;
  const cur = e.currency || d.currency;
  const t = T(d);
  let receipt = undefined;           // undefined = no tocar, null = quitar, string = nueva
  openModal(`
    <h2>${isNew ? `Nuevo: ${(kind === "loan" ? t.loan : t.payment).toLowerCase()}` : "Editar movimiento"}</h2>
    <p class="muted" style="margin:-6px 0 14px;">${esc(d.name)}</p>
    <form id="eForm" class="card pad">
      ${isNew ? "" : `
        <div class="seg" style="margin-bottom:14px;" id="eKind">
          <button type="button" data-k="loan" class="${kind === "loan" ? "on" : ""}">${icon("up")}${t.loan}</button>
          <button type="button" data-k="payment" class="${kind === "payment" ? "on" : ""}">${icon("down")}${t.payment}</button>
        </div>`}
      <div class="two">
        <label class="field"><span>Monto *</span><input id="eAmount" type="number" inputmode="decimal" step="0.01" min="0.01" required value="${e.amount ?? ""}" placeholder="0.00"></label>
        <label class="field"><span>Moneda</span>
          <select id="eCur">${Object.entries(CUR).map(([k, v]) => `<option value="${k}" ${cur === k ? "selected" : ""}>${v.sym} ${v.label}</option>`).join("")}</select></label>
      </div>
      <label class="field"><span>Fecha *</span><input id="eDay" type="date" required value="${e.day || todayApp()}" max="${shiftDays(todayApp(), 1)}"></label>
      <label class="field"><span>Motivo</span><input id="eReason" maxlength="120" value="${esc(e.reason || "")}" placeholder="${kind === "loan" ? "Para la moto, universidad, emergencia…" : wordSide(d) === "owed" ? "Pago de marzo, me transfirió…" : "Abono de marzo, transferencia…"}"></label>
      <label class="field"><span>Nota (opcional)</span><textarea id="eNote" maxlength="500" placeholder="Cualquier detalle que convenga recordar">${esc(e.note || "")}</textarea></label>
      <div class="field">
        <span>Comprobante (captura o foto)</span>
        <div id="eReceiptBox"></div>
        <input type="file" id="eFile" accept="image/*" class="vhidden">
      </div>
      <div id="eMsg"></div>
      <button class="btn primary wide" type="submit">${isNew ? "Registrar" : "Guardar cambios"}</button>
    </form>
  `);
  let curKind = kind;
  $("eKind")?.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => {
    curKind = b.dataset.k;
    $("eKind").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  }));

  const paintReceipt = (uri) => {
    $("eReceiptBox").innerHTML = uri
      ? `<div class="receipt-thumb"><img src="${esc(uri)}" alt=""><button type="button" class="btn sm" id="eRmReceipt">${icon("cross")}Quitar</button></div>`
      : `<button type="button" class="receipt-drop" id="eDrop" style="width:100%;">${icon("camera")}<div>${e.hasReceipt && receipt === undefined ? "Ya tiene comprobante. Toca para reemplazarlo" : "Tocar para elegir una imagen"}</div></button>`;
    $("eDrop")?.addEventListener("click", () => $("eFile").click());
    $("eRmReceipt")?.addEventListener("click", () => { receipt = null; paintReceipt(null); });
  };
  // Al editar, se enseña el comprobante actual si lo hay.
  if (!isNew && e.hasReceipt) {
    paintReceipt(null);
    api(`/api/entries?id=${e.id}&receipt=1`).then(({ image }) => { if (receipt === undefined && $("eReceiptBox")) paintReceipt(image); }).catch(() => {});
  } else paintReceipt(null);
  $("eFile").addEventListener("change", async () => {
    const f = $("eFile").files[0];
    if (!f) return;
    try { receipt = await fileToJpeg(f); paintReceipt(receipt); }
    catch (err) { showErr("eMsg", err); }
    $("eFile").value = "";
  });

  $("eForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button[type="submit"]');
    btn.disabled = true; $("eMsg").innerHTML = "";
    const body = { day: $("eDay").value, amount: $("eAmount").value, currency: $("eCur").value, reason: $("eReason").value, note: $("eNote").value };
    if (receipt !== undefined) body.receipt = receipt;
    try {
      if (isNew) await api("/api/entries", { method: "POST", body: { ...body, debtId: d.id, kind } });
      else await api(`/api/entries?id=${e.id}`, { method: "PUT", body: { ...body, kind: curKind } });
      closeModal(); toast(isNew ? `${kind === "loan" ? t.loan : t.payment} registrado` : "Guardado");
      S.entries = null; await refresh(); loadDebt();
    } catch (err) { showErr("eMsg", err); btn.disabled = false; }
  });
}

/* ===========================================================================
   Simulador: "¿y si abono X cada tanto?"

   Se parte del saldo actual. En cada periodo se suma el interes de esos dias
   (tasa anual / 365 por dia, simple dentro del periodo, capitalizado al pagar) y
   se resta el abono. Termina cuando el saldo llega a cero. Si el abono no cubre
   ni el interes del periodo, la deuda nunca baja y se avisa.
   =========================================================================== */
const FREQS = { weekly: { label: "Semanal", days: 7 }, biweekly: { label: "Quincenal", days: 14 }, monthly: { label: "Mensual", months: 1 } };
function simulate({ balance, amount, freq, start, rate }) {
  const f = FREQS[freq] || FREQS.monthly;
  const rows = [];
  let bal = balance, day = start, prev = start, interest = 0, paid = 0, n = 0;
  while (bal > 0.005 && n < 1200) {
    const dias = n === 0 ? 0 : daysBetween(prev, day);
    const i = rate > 0 ? bal * (rate / 100) * (dias / 365) : 0;
    bal += i; interest += i;
    const pago = Math.min(amount, bal);
    bal -= pago; paid += pago; n++;
    rows.push({ n, day, payment: pago, interest: i, balance: Math.max(0, bal) });
    // Si con el pago el saldo no bajo respecto al periodo anterior, no termina nunca.
    if (n >= 2 && rows[n - 1].balance >= rows[n - 2].balance - 0.005 && bal > 0) return { rows, never: true, interest, paid, n, end: null };
    prev = day;
    day = f.months ? shiftMonths(day, f.months) : shiftDays(day, f.days);
  }
  return { rows, never: bal > 0.005, interest, paid, n, end: rows.length ? rows[rows.length - 1].day : start };
}

function renderSim() {

        <label class="field"><span>Primer pago</span><input type="date" id="simStart" value="${st.start}"></label>
      </div>
      <label class="field"><span>Interés anual (%)</span><input type="number" id="simRate" inputmode="decimal" min="0" max="200" step="0.1" value="${st.rate}">
        <small class="hint">${d.interestRate ? `La deuda tiene ${d.interestRate}% registrado.` : "Déjalo en 0 si no cobra interés (lo normal entre familia)."}</small></label>
      ${(() => {
        // El dato que hace que el simulador no sea un juego: lo que de verdad
        // te sobra al mes. Solo cuando la app lo sabe y la deuda es tuya.
        const cap = wordSide(d) === "owe" ? capacityOf(cur) : null;
        return cap && cap.free > 0
          ? `<div class="msg ok" style="margin:0 0 12px;">Según tus ingresos y gastos, te sobran <b>${money(cap.free, cur)}</b> al mes.</div>` : "";
      })()}
      <div class="field"><span>${wordSide(d) === "owed" ? "Cuánto me abona cada vez" : "Cuánto abono cada vez"} (${CUR[cur].sym}) — hasta 3 escenarios para comparar</span>

  simOut(o, st);

// `o` es { debt, cur, balance }: la parte de una deuda en una moneda.
function simOut(o, st) {
  const cur = o.cur, balance = o.balance;
  const out = $("simOut");
  const scen = st.amounts.map((a, i) => ({ amount: a, color: SERIES[i], r: a > 0 ? simulate({ balance, amount: a, freq: st.freq, start: st.start, rate: st.rate }) : null }));
  const f = FREQS[st.freq];
  // Eje X comun: la simulacion mas larga manda. Se muestrea para no dibujar 300 puntos.
  const maxN = Math.max(0, ...scen.map((s) => (s.r && !s.r.never ? s.r.rows.length : Math.min(s.r?.rows.length || 0, 60))));
  const step = Math.max(1, Math.ceil(maxN / 40));
  const idx = []; for (let i = 0; i <= maxN; i += step) idx.push(i); if (idx[idx.length - 1] !== maxN) idx.push(maxN);
  const dayAt = (i) => (i === 0 ? st.start : f.months ? shiftMonths(st.start, f.months * (i - 1)) : shiftDays(st.start, f.days * (i - 1)));
  const labels = idx.map((i) => (i === 0 ? "hoy" : monthLabel(monthKey(dayAt(i)))));
  const series = scen.map((s) => ({
    name: `${money(s.amount, cur)} ${f.label.toLowerCase()}`, color: s.color,
    values: idx.map((i) => (i === 0 ? balance : s.r && i <= s.r.rows.length ? s.r.rows[i - 1].balance : s.r && !s.r.never ? 0 : null)),
  }));

  out.innerHTML = `
    ${scen.map((s, i) => !s.r ? "" : `
      <div class="card pad" style="margin-top:12px; border-left:3px solid ${s.color};">
        <div class="row"><b class="grow">${wordSide(o.debt) === "owed" ? "Recibiendo" : "Abonando"} ${money(s.amount, cur)} ${f.label.toLowerCase()}</b>${st.amounts.length > 1 ? `<span class="badge">escenario ${i + 1}</span>` : ""}</div>
        ${s.r.never ? `<div class="msg warn" style="margin-bottom:0;">Con ese monto la deuda no baja: el abono no cubre ni el interés del período. Sube el monto.</div>` : `
        <div class="sim-result" style="margin-bottom:0;">
          <div class="tile"><div class="lbl">Termina</div><div class="val">${prettyDay(s.r.end, { year: true })}</div></div>
          <div class="tile"><div class="lbl">Pagos</div><div class="val">${s.r.n} · ${tiempoHumano(st.start, s.r.end)}</div></div>
          <div class="tile"><div class="lbl">${wordSide(o.debt) === "owed" ? "Total a recibir" : "Total pagado"}</div><div class="val">${money(s.r.paid, cur)}</div></div>
          <div class="tile"><div class="lbl">Intereses</div><div class="val ${s.r.interest > 0 ? "bad" : ""}">${money(s.r.interest, cur)}</div></div>
        </div>`}
      </div>`).join("")}
    ${series.some((s) => s.values.some((v) => v != null)) ? `
    <div class="card pad" style="margin-top:12px;">
      <p class="chart-title">Cómo bajaría el saldo</p>
      <p class="chart-sub">Saldo después de cada pago · ${CUR[cur].label}</p>
      <div id="simChart"></div>
      ${chartTable(labels, series, (v) => money(v, cur))}
    </div>` : ""}
    ${scen[0]?.r && !scen[0].r.never ? `
    <details class="plain card" style="margin-top:12px;">
      <summary>${icon("chevron")}Calendario de pagos${st.amounts.length > 1 ? ` (escenario 1)` : ""}</summary>
      <div class="scroll-x"><table class="tbl">
        <thead><tr><th>#</th><th>Fecha</th><th>Pago</th>${st.rate > 0 ? "<th>Interés</th>" : ""}<th>Saldo</th></tr></thead>
        <tbody>${scen[0].r.rows.slice(0, 200).map((r) => `<tr><td>${r.n}</td><td style="text-align:right; color:var(--muted); font-weight:400;">${prettyDay(r.day, { year: true })}</td><td>${money(r.payment, cur)}</td>${st.rate > 0 ? `<td>${money2(r.interest, cur)}</td>` : ""}<td>${money(r.balance, cur)}</td></tr>`).join("")}</tbody>
      </table></div>
      ${scen[0].r.rows.length > 200 ? `<p class="muted" style="padding:0 16px 12px;">Se muestran los primeros 200 pagos.</p>` : ""}
    </details>` : ""}`;
  if ($("simChart")) lineChart($("simChart"), { series, labels, fmtFull: (v) => money(v, cur) });
}
function tiempoHumano(a, b) {
  const dias = daysBetween(a, b);
  if (dias < 45) return plural(Math.max(1, Math.round(dias / 7)), "semana", "semanas");
  const meses = Math.round(dias / 30.44);
  if (meses < 24) return plural(meses, "mes", "meses");
  const anos = Math.floor(meses / 12), resto = meses % 12;
  return `${plural(anos, "año", "años")}${resto ? ` y ${plural(resto, "mes", "meses")}` : ""}`;
}

/* ===========================================================================
   Vista: gastos del hogar

   El mes manda: se elige un mes y todo lo de abajo habla de ese mes. Lo que uno
   quiere saber al abrir esto es una sola cosa — "¿cuánto llevo y me estoy
   pasando?" — asi que eso va arriba y grande, y el detalle debajo.

   El presupuesto es un tope que uno se propone, no una regla: pasarse no
   bloquea nada, solo se pinta en rojo.
   =========================================================================== */
/* ------------------------------------------------------------ el ingreso --
   El sueldo del mes es el ingreso fijo VIGENTE ese mes: la fila 'monthly' con
   la fecha mas alta que no pase del fin de ese mes. Asi un aumento se registra
   con su fecha y los meses viejos siguen contando lo que se ganaba entonces.

   Y si el mes es ANTERIOR al primer sueldo registrado, rige igual ese primero:
   uno anota su sueldo hoy y espera que los meses de atras no aparezcan en cero
   (la misma regla que el pago por dia en asistencia-obra).

   Los ingresos de una sola vez (aguinaldo, un trabajito) se suman aparte, solo
   en el mes en que cayeron.
-------------------------------------------------------------------------- */
function incomeOf(mes, cur) {
  const incs = S.spend?.incomes || [];
  const fijos = incs.filter((i) => i.kind === "monthly" && i.currency === cur).sort((a, b) => a.day.localeCompare(b.day));
  const finDeMes = `${mes}-31`;
  const vigentes = fijos.filter((i) => i.day <= finDeMes);
  const fijo = vigentes.length ? vigentes[vigentes.length - 1] : fijos[0];
  const extras = incs.filter((i) => i.kind === "once" && i.currency === cur && monthKey(i.day) === mes);
  return {
    fixed: fijo ? fijo.amount : 0,
    fixedFrom: fijo ? fijo.day : null,
    extra: extras.reduce((a, i) => a + i.amount, 0),
    extras,
    total: (fijo ? fijo.amount : 0) + extras.reduce((a, i) => a + i.amount, 0),
    has: !!fijo || extras.length > 0,
  };
}

// Lo que se abono a deudas (y lo que me pagaron de un cobro) en un mes. Sale de
// los movimientos que ya trae el resumen, sin pedir nada mas.
function debtFlowOf(mes, cur) {
  let pagado = 0, recibido = 0;
  for (const e of S.sum?.entries || []) {
    if (e.kind !== "payment" || e.currency !== cur || monthKey(e.day) !== mes) continue;
    const d = debtById(e.debtId);
    if (dirOf(d) === "owed") recibido += e.amount; else pagado += e.amount;
  }
  return { pagado, recibido };
}

/* Capacidad de pago: cuanto sobra al mes para abonar, con los pies en la
   tierra. Se compara el ingreso fijo contra lo que de VERDAD se gasta — el
   promedio de los meses COMPLETOS anteriores, no el mes en curso, que va a
   medias y siempre se ve mejor de lo que es.

   No entra lo que ya se abona hoy: la pregunta es "de lo que me queda, cuanto
   puedo comprometer", y lo que uno ya paga es parte de eso. */
function capacityOf(cur, meses = 3) {
  const hoyMes = monthKey(S.spend?.today || todayApp());
  const previos = lastMonths(meses + 1).filter((m) => m < hoyMes);
  if (!previos.length) return null;
  const gastoDe = (m) => (S.spend?.expenses || []).filter((e) => e.currency === cur && monthKey(e.day) === m).reduce((a, e) => a + e.amount, 0);
  const conDatos = previos.filter((m) => gastoDe(m) > 0);
  const ing = incomeOf(hoyMes, cur);
  if (!ing.fixed) return null;
  const gastoPromedio = conDatos.length ? conDatos.reduce((a, m) => a + gastoDe(m), 0) / conDatos.length : 0;
  return {
    income: ing.fixed, spend: Math.round(gastoPromedio * 100) / 100,
    free: Math.round((ing.fixed - gastoPromedio) * 100) / 100,
    months: conDatos.length,
  };
}

const catById = (id) => (S.spend?.categories || []).find((c) => c.id === id) || null;
// El color de una categoria sigue a la categoria (su orden de creacion), no a
// su posicion en la lista de este mes: si se filtra o se reordena, el verde
// sigue siendo el verde.
const catColor = (id) => {
  const i = (S.spend?.categories || []).findIndex((c) => c.id === id);
  return i < 0 ? "var(--faint)" : SERIES[i % SERIES.length];
};

// El simulador y la capacidad de pago necesitan los gastos, asi que se piden
// tambien al entrar ahi (una vez; despues estan en memoria).
async function ensureSpend() {
  if (!isAdmin() || S.spend) return;
  try { S.spend = await api("/api/expenses"); } catch { /* sin gastos, el simulador funciona igual */ }
}

async function loadSpend() {
  if (!isAdmin()) return setView("home");
  if (!S.spend) {
    try { S.spend = await api("/api/expenses"); }
    catch (err) { $("spendBody").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; return; }
  }
