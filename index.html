// Vuelve a pedir los gastos (despues de cualquier cambio).
async function refreshSpend() {
  S.spend = await api("/api/expenses");
  if (S.view === "spend") renderSpend();
}

function renderSpend() {
  const body = $("spendBody");
  const { categories, expenses } = S.spend;
  const activas = categories.filter((c) => c.active);

  if (!categories.length && !(S.spend.incomes || []).length) {
    body.innerHTML = `
      <div class="card" style="margin-top:18px;">
        ${emptyState("cart", "Para llevar el gasto del hogar hacen falta <b>categorías</b>:<br>Comida, Casa, Transporte…")}
        <div class="pad" style="padding-top:0;">
          <button class="btn primary wide" id="spSeed">${icon("plus")}Crear las categorías típicas</button>
          <button class="btn wide" id="spNewCat" style="margin-top:8px;">Crear la mía</button>
        </div>
      </div>`;
    $("spSeed").addEventListener("click", async () => {
      try { await api("/api/categories?seed=1", { method: "POST" }); await refreshSpend(); toast("Categorías creadas"); }
      catch (err) { toast(err.message, "err"); }
    });
    $("spNewCat").addEventListener("click", () => categoryForm(null));
    return;
  }

  const mes = S.spendMonth || monthKey(S.spend.today);
  S.spendMonth = mes;
  const delMes = expenses.filter((e) => monthKey(e.day) === mes);
  // Monedas que aparecen: las de los gastos del mes y las de los presupuestos.
  const curs = [...new Set([...delMes.map((e) => e.currency), ...activas.filter((c) => c.budget).map((c) => c.currency), "NIO"])];
  curs.sort((a) => (a === "NIO" ? -1 : 1));
  const cur = curs.includes(S.spendCur) ? S.spendCur : curs[0];
  S.spendCur = cur;
  const enCur = delMes.filter((e) => e.currency === cur);
  const gastado = enCur.reduce((a, e) => a + e.amount, 0);
  const ing = incomeOf(mes, cur);
  const flujo = debtFlowOf(mes, cur);
  // Lo que queda de verdad este mes: lo que entro menos lo que se gasto y lo
  // que ya se abono a deudas. Lo que me pagaron de un cobro tambien entro.
  const disponible = ing.total + flujo.recibido - gastado - flujo.pagado;
  const cap = capacityOf(cur);
  // El presupuesto del mes es la suma de los topes de las categorias EN ESTA
  // MONEDA (las que no tienen tope no suman nada, y se avisa abajo).
  const conTope = activas.filter((c) => c.budget && c.currency === cur);
  const tope = conTope.reduce((a, c) => a + c.budget, 0);
  const esteMes = mes === monthKey(S.spend.today);
  // Cuanto del mes ha pasado: comparar "llevo 60%" contra "va el 50% del mes"
  // es lo que de verdad dice si uno va bien o mal.
  const diasMes = new Date(Number(mes.slice(0, 4)), Number(mes.slice(5, 7)), 0).getDate();
  const diaHoy = esteMes ? Number(S.spend.today.slice(8, 10)) : diasMes;
  const pctMes = Math.round((diaHoy / diasMes) * 100);
  const pctGasto = tope > 0 ? Math.round((gastado / tope) * 100) : 0;
  const estado = !tope ? "" : pctGasto > 100 ? "bad" : pctGasto > pctMes + 10 ? "warn" : "ok";

  // Por categoria, de mayor a menor: es el orden en el que uno se pregunta
  // "¿en qué se me fue la plata?".
  const porCat = activas.map((c) => {
    const suyos = enCur.filter((e) => e.categoryId === c.id);
    return { cat: c, total: suyos.reduce((a, e) => a + e.amount, 0), n: suyos.length };
  }).filter((x) => x.total > 0 || (x.cat.budget && x.cat.currency === cur));
  const sinCat = enCur.filter((e) => e.categoryId == null);
  if (sinCat.length) porCat.push({ cat: { id: null, name: "Sin categoría", budget: null }, total: sinCat.reduce((a, e) => a + e.amount, 0), n: sinCat.length });
  porCat.sort((a, b) => b.total - a.total);
  const maxCat = Math.max(1, ...porCat.map((x) => x.total));

  // Gasto por mes (12 meses) con el tope como referencia, en la misma escala.
  const months = lastMonths(12), labels = months.map(monthLabel);
  const porMes = months.map((m) => expenses.filter((e) => e.currency === cur && monthKey(e.day) === m).reduce((a, e) => a + e.amount, 0));
  const serieMes = [{ name: "Gastado", color: SERIES[0], values: porMes }];
  if (tope > 0) serieMes.push({ name: "Presupuesto", color: SERIES[3], values: months.map(() => tope) });

  body.innerHTML = `
    <div class="daybar" style="margin:14px 0 12px;">
      <button class="nav" id="spPrev" aria-label="Mes anterior">${icon("left")}</button>
      <div class="day"><b class="cap">${monthLong(mes)}</b><small>${plural(delMes.length, "gasto", "gastos")}${esteMes ? ` · día ${diaHoy} de ${diasMes}` : ""}</small></div>
      <button class="nav" id="spNext" aria-label="Mes siguiente" ${mes >= monthKey(S.spend.today) ? "disabled style='opacity:.3'" : ""}>${icon("right")}</button>
    </div>
    ${curs.length > 1 ? `<div class="chips" style="margin-bottom:12px;">${curs.map((c) => `<button class="chip ${c === cur ? "on" : ""}" data-spc="${c}">${CUR[c].sym} ${CUR[c].label}</button>`).join("")}</div>` : ""}

    <div class="card hero">
      <div class="lbl">Gastado en ${monthLong(mes).split(" ")[0]}</div>
      <div class="val"><small>${CUR[cur].sym}</small>${nfMoney.format(gastado)}</div>
      ${tope > 0 ? `
        <div class="sub">de ${money(tope, cur)} que te propusiste · <b style="color:var(${estado === "bad" ? "--bad" : estado === "warn" ? "--half" : "--ok"});">${pctGasto}%</b>${esteMes ? ` (va el ${pctMes}% del mes)` : ""}</div>
        <div class="meter" style="margin-top:12px; height:8px;">
          <i style="width:${Math.min(100, pctGasto)}%; background:var(${estado === "bad" ? "--bad" : estado === "warn" ? "--half" : "--ok"});"></i>
        </div>
        ${pctGasto > 100 ? `<div class="sub" style="margin-top:8px; color:var(--bad);">Te pasaste por ${money(gastado - tope, cur)}</div>`
          : `<div class="sub" style="margin-top:8px;">Te quedan ${money(tope - gastado, cur)}${esteMes && diaHoy < diasMes ? ` · ${money((tope - gastado) / (diasMes - diaHoy + 1), cur)} por día` : ""}</div>`}
      ` : `<div class="sub">Sin presupuesto puesto. Ponle un tope a tus categorías y aquí verás cuánto llevas.</div>`}
    </div>

    ${ing.has ? `
    <div class="card pad" style="margin-top:12px;">
      <div class="row" style="margin-bottom:10px;">
        <b class="grow">Cómo va el mes</b>
        <button class="btn sm" id="spInc">${icon("edit")}Ingresos</button>
      </div>
      <div class="flow">
        <div class="flow-row"><span>Entró${ing.extra ? ` (sueldo ${money(ing.fixed, cur)} + extras ${money(ing.extra, cur)})` : ""}</span><b class="good">+${money(ing.total, cur)}</b></div>
        ${flujo.recibido ? `<div class="flow-row"><span>Me pagaron de un cobro</span><b class="good">+${money(flujo.recibido, cur)}</b></div>` : ""}
        <div class="flow-row"><span>Gastos del hogar</span><b class="bad">−${money(gastado, cur)}</b></div>
        ${flujo.pagado ? `<div class="flow-row"><span>Abonado a deudas</span><b class="bad">−${money(flujo.pagado, cur)}</b></div>` : ""}
        <div class="flow-row total"><span>${disponible >= 0 ? "Te queda" : "Te faltó"}</span><b class="${disponible >= 0 ? "good" : "bad"}">${money(Math.abs(disponible), cur)}</b></div>
      </div>
      ${cap ? `
        <div class="msg ${cap.free > 0 ? "ok" : "warn"}" style="margin:12px 0 0;">
          ${cap.free > 0
            ? `Ganando ${money(cap.income, cur)} y gastando ${money(cap.spend, cur)} al mes (promedio de ${plural(cap.months, "mes", "meses")}), puedes abonar hasta <b>${money(cap.free, cur)}</b> al mes sin apretarte.`
            : `Con ${money(cap.income, cur)} de ingreso y ${money(cap.spend, cur)} de gasto promedio, no te sobra nada al mes. Habría que bajar algún gasto antes de comprometer un abono.`}
        </div>
        ${cap.free > 0 ? `<button class="btn wide" id="spSim" style="margin-top:8px;">${icon("calc")}Simular un abono de ${money(cap.free, cur)} al mes</button>` : ""}
      ` : ""}
    </div>` : `
    <div class="card pad" style="margin-top:12px;">
      <div class="row" style="gap:10px;">
        ${icon("coins")}
        <span class="grow muted">Anota tu <b>ingreso mensual</b> y la app te dice cuánto te queda y cuánto puedes abonar sin apretarte.</span>
      </div>
      <button class="btn wide" id="spInc" style="margin-top:10px;">${icon("plus")}Registrar mi ingreso</button>
    </div>`}

    ${isAdmin() ? `<button class="btn primary wide" id="spAdd" style="margin-top:12px;">${icon("plus")}Anotar un gasto</button>` : ""}

    ${porCat.length ? `
    <h3>En qué se fue</h3>
    <div class="card pad">
      ${porCat.map(({ cat, total, n }) => {
        const p = cat.budget && cat.currency === cur ? Math.round((total / cat.budget) * 100) : null;
        const col = cat.id == null ? "var(--faint)" : catColor(cat.id);
        return `
        <button class="cat-row" data-cat="${cat.id ?? ""}">
          <div class="row" style="gap:8px;">
            <span class="grow ellip" style="font-weight:500;">${esc(cat.name)}</span>
            <span class="num" style="font-weight:600;">${money(total, cur)}</span>
          </div>
          <div class="meter" style="margin-top:7px;"><i style="width:${Math.round((total / maxCat) * 100)}%; background:${col};"></i></div>
          <div class="foot">
            <span>${plural(n, "gasto", "gastos")}</span>
            <span>${p == null ? `${Math.round((total / (gastado || 1)) * 100)}% del mes` : `${p}% de ${money(cat.budget, cur)}${p > 100 ? " · te pasaste" : ""}`}</span>
          </div>
        </button>`;
      }).join("")}
    </div>` : ""}

    ${porMes.some((v) => v > 0) ? `
    <div class="card pad" style="margin-top:14px;">
      <p class="chart-title">Cuánto gastas cada mes</p>
      <p class="chart-sub">Últimos 12 meses · ${CUR[cur].label}${tope > 0 ? " · la línea es tu presupuesto" : ""}</p>
      <div id="spChart"></div>
      ${chartTable(labels, serieMes, (v) => money(v, cur))}
    </div>` : ""}

    <h3>Los gastos de ${monthLong(mes)}</h3>
    <div class="card" id="spList">
      ${enCur.length ? gastosHtml(enCur) : emptyState("cart", `Sin gastos en ${CUR[cur].label} este mes.`)}
    </div>`;

  // Grafico: barras por mes; el presupuesto va como una linea sobre las mismas
  // barras, en la MISMA escala (un solo eje: nunca dos escalas en un grafico).
  if ($("spChart")) {
    barChart($("spChart"), { series: [serieMes[0]], labels, fmtFull: (v) => money(v, cur) });
    if (tope > 0) pintaTope($("spChart"), months.length, tope, Math.max(...porMes, tope));
  }
  $("spPrev").addEventListener("click", () => { S.spendMonth = shiftMonthKey(mes, -1); renderSpend(); });
  $("spNext").addEventListener("click", () => { if (mes < monthKey(S.spend.today)) { S.spendMonth = shiftMonthKey(mes, 1); renderSpend(); } });
  body.querySelectorAll("[data-spc]").forEach((b) => b.addEventListener("click", () => { S.spendCur = b.dataset.spc; renderSpend(); }));
  $("spAdd")?.addEventListener("click", () => expenseForm({ day: esteMes ? S.spend.today : `${mes}-01`, currency: cur }));
  $("spInc")?.addEventListener("click", incomesScreen);
  // Del "puedes abonar X al mes" directo al simulador, con el monto ya puesto.
  $("spSim")?.addEventListener("click", () => {
    const opts = (S.sum?.debts || []).filter((d) => d.active && d.totals[cur]?.balance > 0);
    const o = opts.find((d) => dirOf(d) === "owe") || opts[0];
    if (!o) return toast("No tienes deudas con saldo en esta moneda.", "err");
    S.simScen = { key: `${o.id}-${cur}`, freq: "monthly", start: todayApp(), rate: o.interestRate || 0, amounts: [Math.round(cap.free)] };
    setView("sim");
  });
  body.querySelectorAll("[data-cat]").forEach((b) => b.addEventListener("click", () => categoryDetail(b.dataset.cat === "" ? null : Number(b.dataset.cat), mes, cur)));
  body.querySelectorAll("[data-exp]").forEach((b) => b.addEventListener("click", () => expenseDetail(Number(b.dataset.exp))));
}

const shiftMonthKey = (mes, n) => monthKey(shiftMonths(`${mes}-01`, n));

// Lista de gastos agrupada por dia.
function gastosHtml(list) {
  let out = "", dia = null;
  for (const e of list) {
    if (e.day !== dia) {
      dia = e.day;
      const total = list.filter((x) => x.day === dia).reduce((a, x) => a + x.amount, 0);
      out += `<div class="month-head" style="display:flex; justify-content:space-between;"><span class="cap">${prettyDayLong(dia).replace(/ de \d{4}$/, "")}</span><span>${money(total, e.currency)}</span></div>`;
    }
    const c = e.categoryId == null ? null : catById(e.categoryId);
    out += `
      <button class="entry" data-exp="${e.id}">
        <div class="dir" style="background:var(--soft); color:${e.categoryId == null ? "var(--faint)" : catColor(e.categoryId)};">${icon("tag")}</div>
        <div class="grow">
          <div class="what ellip">${esc(e.reason || c?.name || "Gasto")}</div>
          <div class="when">${esc(c?.name || "Sin categoría")}${e.hasReceipt ? icon("image") : ""}</div>
        </div>
        <div class="amt">${money(e.amount, e.currency)}</div>
      </button>`;
  }
  return out;
}

// La linea del presupuesto encima de las barras del grafico de meses.
function pintaTope(el, n, tope, max) {
  const svg = el.querySelector("svg");
  if (!svg) return;
  const W = 600, H = 200, ML = 46, MR = 14, MT = 12, MB = 26;
  const ticks = niceTicks(max), top = ticks[ticks.length - 1] || 1;
  const y = MT + (1 - tope / top) * (H - MT - MB);
  svg.insertAdjacentHTML("beforeend",
    `<line x1="${ML}" x2="${W - MR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${SERIES[3]}" stroke-width="2" stroke-linecap="round"/>`);
}

/* --------------------------------- ingresos ------------------------------ */
const INCOME_KIND = { monthly: "Fijo cada mes", once: "Una sola vez" };

async function incomesScreen() {
  if (!S.spend) { try { S.spend = await api("/api/expenses"); } catch (err) { return toast(err.message, "err"); } }
  const incs = S.spend.incomes || [];
  const fijos = incs.filter((i) => i.kind === "monthly");
  const extras = incs.filter((i) => i.kind === "once");
  const fila = (i) => `
    <button class="list-item" data-i="${i.id}">
      ${icon(i.kind === "monthly" ? "coins" : "up")}
      <div class="grow">
        <div class="ellip"><b>${money(i.amount, i.currency)}</b>${i.source ? ` · ${esc(i.source)}` : ""}</div>
        <div class="muted">${i.kind === "monthly" ? `desde ${prettyDay(i.day, { year: true })}` : prettyDay(i.day, { year: true })}</div>
      </div>
      ${icon("chevron", "chev")}
    </button>`;
  openModal(`
    <h2>Mis ingresos</h2>
    <p class="muted" style="margin:-6px 0 12px;">El <b>ingreso fijo</b> es tu sueldo: se repite cada mes y rige desde la fecha que le pongas. Si te aumentan, agregas otro con la fecha del aumento y los meses viejos siguen contando lo de antes.</p>
    <h3>Fijo cada mes</h3>
    <div class="card">${fijos.length ? fijos.map(fila).join("") : emptyState("coins", "Sin ingreso fijo. Es el dato que hace falta para saber cuánto puedes abonar.")}</div>
    ${extras.length ? `<h3>Una sola vez</h3><div class="card">${extras.map(fila).join("")}</div>` : ""}
    <div class="row" style="gap:8px; margin-top:12px;">
      <button class="btn primary grow" id="incNewFixed">${icon("plus")}Ingreso fijo</button>
      <button class="btn grow" id="incNewOnce">${icon("plus")}Extra de un mes</button>
    </div>`);
  $("modalRoot").querySelectorAll("[data-i]").forEach((b) => b.addEventListener("click", () => incomeForm(incs.find((i) => i.id === Number(b.dataset.i)))));
  $("incNewFixed").addEventListener("click", () => incomeForm({ kind: "monthly", currency: S.spendCur || "NIO" }));
  $("incNewOnce").addEventListener("click", () => incomeForm({ kind: "once", currency: S.spendCur || "NIO", day: S.spend.today }));
}

function incomeForm(i) {
  const isNew = !i.id;
  const fijo = i.kind === "monthly";
  openModal(`
    <h2>${isNew ? (fijo ? "Ingreso fijo mensual" : "Ingreso extra") : "Editar ingreso"}</h2>
    <p class="muted" style="margin:-6px 0 14px;">${fijo
      ? "Tu sueldo: se cuenta en todos los meses desde la fecha que pongas."

    <form id="iForm" class="card pad">
      <div class="two">
        <label class="field"><span>Monto *</span><input id="iAmount" type="number" inputmode="decimal" step="0.01" min="0.01" required value="${i.amount ?? ""}" placeholder="0.00"></label>
        <label class="field"><span>Moneda</span>

      <label class="field"><span>De dónde viene</span><input id="iSource" maxlength="120" value="${esc(i.source || "")}" placeholder="${fijo ? "Salario, negocio…" : "Aguinaldo, trabajo extra…"}"></label>

      <div id="iMsg"></div>
      <button class="btn primary wide" type="submit">${isNew ? "Guardar" : "Guardar cambios"}</button>
    </form>
    ${isNew ? "" : `<button class="btn danger wide" id="iDel" style="margin-top:10px;">${icon("trash")}Borrar</button>`}`);

    catch (err) { toast(err.message, "err"); }
  });
}

/* --------------------------- detalle de una categoria ------------------- */
function categoryDetail(catId, mes, cur) {
  const c = catId == null ? { id: null, name: "Sin categoría", budget: null } : catById(catId);
  if (!c) return;
  const list = S.spend.expenses.filter((e) => monthKey(e.day) === mes && e.currency === cur && (e.categoryId ?? null) === catId);
  const total = list.reduce((a, e) => a + e.amount, 0);
  // Los ultimos 6 meses de ESTA categoria: si algo se disparó, se ve aquí.
  const months = lastMonths(6), labels = months.map(monthLabel);
  const serie = [{ name: c.name, color: catId == null ? "var(--faint)" : catColor(catId), values: months.map((m) => S.spend.expenses.filter((e) => e.currency === cur && monthKey(e.day) === m && (e.categoryId ?? null) === catId).reduce((a, e) => a + e.amount, 0)) }];
  openModal(`
    <h2>${esc(c.name)}</h2>
    <p class="muted" style="margin:-6px 0 14px;">${monthLong(mes)} · ${plural(list.length, "gasto", "gastos")}</p>
    <div class="tiles" style="grid-template-columns:1fr 1fr;">
      <div class="tile"><div class="lbl">Gastado</div><div class="val">${money(total, cur)}</div></div>
      <div class="tile"><div class="lbl">Presupuesto</div><div class="val ${c.budget && total > c.budget ? "bad" : ""}">${c.budget ? money(c.budget, c.currency) : "—"}</div></div>
    </div>
    <div class="card pad" style="margin-top:12px;">
      <p class="chart-title">Últimos 6 meses</p>
      <div id="cdChart"></div>
      ${chartTable(labels, serie, (v) => money(v, cur))}
    </div>
    <h3>Los gastos del mes</h3>
    <div class="card" id="cdList">${list.length ? gastosHtml(list) : emptyState("cart", "Sin gastos este mes.")}</div>
    ${catId != null ? `<button class="btn wide" id="cdEdit" style="margin-top:12px;">${icon("edit")}Editar categoría y presupuesto</button>` : ""}`);
  barChart($("cdChart"), { series: serie, labels, fmtFull: (v) => money(v, cur), height: 160 });
  $("cdEdit")?.addEventListener("click", () => categoryForm(c));
  $("modalRoot").querySelectorAll("[data-exp]").forEach((b) => b.addEventListener("click", () => expenseDetail(Number(b.dataset.exp))));
}

/* ------------------------------ alta de gasto --------------------------- */
function expenseForm(e) {
  const isNew = !e.id;
  const cats = S.spend.categories.filter((c) => c.active || c.id === e.categoryId);
  let receipt = undefined;
  openModal(`
    <h2>${isNew ? "Anotar un gasto" : "Editar gasto"}</h2>
    <form id="xForm" class="card pad">
      <div class="two">
        <label class="field"><span>Monto *</span><input id="xAmount" type="number" inputmode="decimal" step="0.01" min="0.01" required value="${e.amount ?? ""}" placeholder="0.00"></label>
        <label class="field"><span>Moneda</span>
          <select id="xCur">${Object.entries(CUR).map(([k, v]) => `<option value="${k}" ${(e.currency || "NIO") === k ? "selected" : ""}>${v.sym} ${v.label}</option>`).join("")}</select></label>
      </div>
      <div class="two">
        <label class="field"><span>Fecha *</span><input id="xDay" type="date" required value="${e.day || todayApp()}" max="${todayApp()}"></label>
        <label class="field"><span>Categoría</span>
          <select id="xCat">
            <option value="">Sin categoría</option>
            ${cats.map((c) => `<option value="${c.id}" ${e.categoryId === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
          </select></label>
      </div>
      <label class="field"><span>En qué</span><input id="xReason" maxlength="120" value="${esc(e.reason || "")}" placeholder="Supermercado, gasolina, luz…"></label>
      <label class="field"><span>Nota (opcional)</span><textarea id="xNote" maxlength="500" placeholder="Cualquier detalle">${esc(e.note || "")}</textarea></label>
      <div class="field">
        <span>Captura del recibo</span>
        <div id="xReceiptBox"></div>
        <input type="file" id="xFile" accept="image/*" class="vhidden">
      </div>
      <div id="xMsg"></div>
      <button class="btn primary wide" type="submit">${isNew ? "Anotar" : "Guardar cambios"}</button>
    </form>`);

  const paintReceipt = (uri) => {
    $("xReceiptBox").innerHTML = uri
      ? `<div class="receipt-thumb"><img src="${esc(uri)}" alt=""><button type="button" class="btn sm" id="xRm">${icon("cross")}Quitar</button></div>`
      : `<button type="button" class="receipt-drop" id="xDrop" style="width:100%;">${icon("camera")}<div>${e.hasReceipt && receipt === undefined ? "Ya tiene captura. Toca para reemplazarla" : "Tocar para elegir una imagen"}</div></button>`;
    $("xDrop")?.addEventListener("click", () => $("xFile").click());
    $("xRm")?.addEventListener("click", () => { receipt = null; paintReceipt(null); });
  };
  paintReceipt(null);
  if (!isNew && e.hasReceipt) {
    api(`/api/expenses?id=${e.id}&receipt=1`).then(({ image }) => { if (receipt === undefined && $("xReceiptBox")) paintReceipt(image); }).catch(() => {});
  }
  $("xFile").addEventListener("change", async () => {
    const f = $("xFile").files[0];
    if (!f) return;
    try { receipt = await fileToJpeg(f); paintReceipt(receipt); }
    catch (err) { showErr("xMsg", err); }
    $("xFile").value = "";
  });

  $("xForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button[type="submit"]');
    btn.disabled = true; $("xMsg").innerHTML = "";
    const body = {
      day: $("xDay").value, amount: $("xAmount").value, currency: $("xCur").value,
      categoryId: $("xCat").value || null, reason: $("xReason").value, note: $("xNote").value,
    };
    if (receipt !== undefined) body.receipt = receipt;
    try {
      if (isNew) await api("/api/expenses", { method: "POST", body });
      else await api(`/api/expenses?id=${e.id}`, { method: "PUT", body });
      closeModal(); toast(isNew ? "Gasto anotado" : "Guardado");

/* ===========================================================================
   Vista: mantenimiento del vehiculo

   Lo unico que uno quiere saber al abrir esto es qué le toca ya. Asi que eso va
   arriba, y el historial debajo.

   Cuándo toca una tarea se calcula de las dos formas y manda la que llegue
   primero, que es como funciona un manual de verdad: "aceite cada 3.000 km o
   cada 6 meses". Si nunca se le ha hecho, toca desde ya.
   =========================================================================== */
const VEH_META = {
  moto:  { label: "Moto", icon: "moto" },
  car:   { label: "Carro", icon: "wallet" },
  other: { label: "Otro", icon: "wrench" },
};

const vehById = (id) => (S.veh?.vehicles || []).find((v) => v.id === id) || null;
const currentVeh = () => vehById(S.vehId) || (S.veh?.vehicles || []).find((v) => v.active) || null;
const tasksOf = (vehId) => (S.veh?.tasks || []).filter((t) => t.vehicleId === vehId && t.active);
const servicesOf = (vehId) => (S.veh?.services || []).filter((s) => s.vehicleId === vehId);
// El mantenimiento y las reparaciones por un lado; los accesorios por otro. Un
// accesorio no es algo que haya que repetir: es una mejora, y lo que uno quiere
// saber de ellos es cuanto lleva invertido.
const mantOf = (vehId) => servicesOf(vehId).filter((s) => s.kind !== "accessory");
const accsOf = (vehId) => servicesOf(vehId).filter((s) => s.kind === "accessory");

/* Estado de una tarea: cuando toca por km, cuando por fecha, y cual manda.

   Devuelve `{ last, kmLeft, daysLeft, due, overdue, by }`:
     kmLeft   km que faltan (null si la tarea no va por km, o si no hay
              kilometraje anotado con que comparar)
     daysLeft dias que faltan
     due      true si ya toca (por cualquiera de las dos)
     by       'km' | 'date' | 'never': que fue lo que la hizo tocar */
function taskStatus(task, veh) {
  // Un mismo servicio puede haber cubierto varias tareas (el mantenimiento de
  // la casa comercial cubre aceite, filtro y cadena de un tiro), asi que se
  // busca en la lista de tareas que cubrio, no en un solo campo.
  const hechos = servicesOf(veh.id).filter((s) => (s.taskIds || []).includes(task.id));
  const last = hechos.length ? cronologico(hechos)[hechos.length - 1] : null;
  const hoy = S.veh?.today || todayApp();
  if (!last) return { last: null, kmLeft: null, daysLeft: null, due: true, overdue: false, by: "never" };

  let kmLeft = null;
  if (task.everyKm && last.odometer != null && veh.odometer != null) {
    kmLeft = last.odometer + task.everyKm - veh.odometer;
  }
  let daysLeft = null;
  if (task.everyMonths) daysLeft = daysBetween(hoy, shiftMonths(last.day, task.everyMonths));

  const porKm = kmLeft != null && kmLeft <= 0;
  const porFecha = daysLeft != null && daysLeft <= 0;
  return {
    last, kmLeft, daysLeft,
    due: porKm || porFecha,
    overdue: porKm || porFecha,
    by: porKm ? "km" : porFecha ? "date" : null,
  };
}

// Como se dice en una linea. Lo mas urgente primero.
function taskText(t, st) {
  if (st.by === "never") return "Nunca se le ha hecho";
  const partes = [];
  if (st.kmLeft != null) partes.push(st.kmLeft <= 0 ? `${nfMoney.format(-st.kmLeft)} km pasados` : `faltan ${nfMoney.format(st.kmLeft)} km`);
  if (st.daysLeft != null) partes.push(st.daysLeft <= 0 ? `${plural(-st.daysLeft, "día", "días")} pasados` : st.daysLeft <= 45 ? `faltan ${plural(st.daysLeft, "día", "días")}` : `faltan ${plural(Math.round(st.daysLeft / 30.44), "mes", "meses")}`);
  return partes.join(" · ") || "Sin intervalo";
}

// Que tan urgente es, para ordenar y para el color. Menor = mas urgente.
function taskUrgency(t, st) {
  if (st.by === "never") return -1;
  const porKm = st.kmLeft != null && t.everyKm ? st.kmLeft / t.everyKm : 1;
  const porDia = st.daysLeft != null && t.everyMonths ? st.daysLeft / (t.everyMonths * 30.44) : 1;
  return Math.min(porKm, porDia);
}

  const body = $("vehBody");

  if (!vehs.length) {
    body.innerHTML = `
      <div class="card" style="margin-top:18px;">
        ${emptyState("moto", "Anota tu moto o tu carro y la app te dice <b>qué le toca ya</b>:<br>aceite, llantas, seguro, revisión.")}

  const v = vehs.some((x) => x.id === S.vehId) ? vehById(S.vehId) : vehs[0];

  const tasks = tasksOf(v.id);

  const accs = accsOf(v.id);
  const estados = tasks.map((t) => ({ t, st: taskStatus(t, v) })).sort((a, b) => taskUrgency(a.t, a.st) - taskUrgency(b.t, b.st));
  const toca = estados.filter((x) => x.st.due);

/* ------------------------------ tareas ---------------------------------- */
function tasksScreen() {

  const tasks = (S.veh.tasks || []).filter((t) => t.vehicleId === v.id);
  const intervalo = (t) => [t.everyKm ? `cada ${nfMoney.format(t.everyKm)} km` : null, t.everyMonths ? `cada ${plural(t.everyMonths, "mes", "meses")}` : null].filter(Boolean).join(" o ");
  openModal(`
    <h2>Tareas de ${esc(v.name)}</h2>
    <p class="muted" style="margin:-6px 0 12px;">Lo que hay que repetir. Si pones las dos cosas, toca <b>lo que llegue primero</b>: "cada 3.000 km o cada 6 meses".</p>
    <div class="card">
      ${tasks.length ? tasks.map((t) => `
        <button class="list-item" data-t="${t.id}">
          ${icon("wrench")}
          <div class="grow">
            <div class="ellip"><b>${esc(t.name)}</b>${t.active ? "" : ' <span class="badge off">archivada</span>'}</div>
            <div class="muted">${intervalo(t) || "sin intervalo"}</div>

function taskForm(t) {
  const isNew = !t;
  const v = currentVeh();
  openModal(`
    <h2>${isNew ? "Nueva tarea" : esc(t.name)}</h2>
    <form id="tForm" class="card pad">
      <label class="field"><span>Qué es *</span><input id="tName" required maxlength="80" value="${esc(t?.name || "")}" placeholder="Cambio de aceite, llantas…"></label>
      <div class="two">
        <label class="field"><span>Cada cuántos km</span><input id="tKm" type="number" inputmode="numeric" min="1" value="${t?.everyKm ?? ""}" placeholder="3000"></label>
        <label class="field"><span>Cada cuántos meses</span><input id="tMonths" type="number" inputmode="numeric" min="1" max="600" value="${t?.everyMonths ?? ""}" placeholder="6"></label>
      </div>
      <p class="muted" style="margin:-4px 0 12px;">Puedes poner uno o los dos. Con los dos, toca lo que llegue primero.</p>
      <label class="field"><span>Nota</span><textarea id="tNote" maxlength="300" placeholder="Qué aceite, qué medida de llanta…">${esc(t?.note || "")}</textarea></label>
      ${isNew ? "" : `<label class="row" style="margin-bottom:12px; gap:8px;"><input type="checkbox" id="tActive" ${t.active ? "checked" : ""} style="width:20px; height:20px;"><span>Tarea activa</span></label>`}
      <div id="tMsg"></div>
      <button class="btn primary wide" type="submit">${isNew ? "Crear" : "Guardar"}</button>
    </form>
    ${isNew ? "" : `<button class="btn danger wide" id="tDel" style="margin-top:10px;">${icon("trash")}Borrar la tarea</button>`}`);
  $("tForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const body = { name: $("tName").value, everyKm: $("tKm").value, everyMonths: $("tMonths").value, note: $("tNote").value };
    if (!isNew) body.active = $("tActive").checked;
    try {
      if (isNew) await api("/api/vehicles?task=1", { method: "POST", body: { ...body, vehicleId: v.id } });

      closeModal(); toast("Guardado"); await refreshVeh(); tasksScreen();

    try { await api(`/api/vehicles?task=${t.id}&hard=1`, { method: "DELETE" }); closeModal(); toast("Tarea borrada"); await refreshVeh(); tasksScreen(); }
    catch (err) { toast(err.message, "err"); }
  });
}

function taskDetail(t, v) {
  if (!t) return;
  const st = taskStatus(t, v);
  const hechos = servicesOf(v.id).filter((s) => (s.taskIds || []).includes(t.id));
  openModal(`
    <h2>${esc(t.name)}</h2>
    <p class="muted" style="margin:-6px 0 14px;">${esc(v.name)} · ${[t.everyKm ? `cada ${nfMoney.format(t.everyKm)} km` : null, t.everyMonths ? `cada ${plural(t.everyMonths, "mes", "meses")}` : null].filter(Boolean).join(" o ")}</p>
    <div class="msg ${st.due ? "err" : taskUrgency(t, st) <= 0.25 ? "warn" : "ok"}">
      <b>${st.by === "never" ? "Nunca se le ha hecho" : st.due ? "Ya toca" : "Al día"}</b> · ${taskText(t, st)}
    </div>
    ${t.note ? `<div class="card pad muted" style="margin-bottom:12px;">${esc(t.note)}</div>` : ""}
    <button class="btn primary wide" id="tdDo">${icon("plus")}Anotar que se hizo</button>
    <h3>Veces que se ha hecho</h3>
    <div class="card">
      ${hechos.length ? hechos.map((s) => `
        <button class="list-item" data-srv2="${s.id}">
          ${icon("wrench")}
          <div class="grow">
            <div class="ellip"><b>${prettyDay(s.day, { year: true })}</b></div>
            <div class="muted">${s.odometer != null ? `${nfMoney.format(s.odometer)} km` : "sin km"}${s.place ? ` · ${esc(s.place)}` : ""}</div>
          </div>
          <span class="num">${s.cost == null ? "—" : money(s.cost, s.currency)}</span>
        </button>`).join("") : emptyState("wrench", "Todavía no se le ha hecho.")}
    </div>
    <button class="btn wide" id="tdEdit" style="margin-top:12px;">${icon("edit")}Editar la tarea</button>`);
  $("tdDo").addEventListener("click", () => serviceForm({ vehicleId: v.id, kind: "service", taskIds: [t.id], title: t.name, day: S.veh.today, odometer: v.odometer ?? "" }));
  $("tdEdit").addEventListener("click", () => taskForm(t));
  $("modalRoot").querySelectorAll("[data-srv2]").forEach((b) => b.addEventListener("click", () => serviceDetail(Number(b.dataset.srv2))));
}

/* ------------------------------ servicios ------------------------------- */
function serviceForm(s) {
  const isNew = !s.id;
  const v = vehById(s.vehicleId) || currentVeh();
  const tasks = tasksOf(v.id);
  const cats = (S.spend?.categories || []).filter((c) => c.active);
  const esAcc = s.kind === "accessory";
  const marcadas = new Set(s.taskIds || []);
  let receipt = undefined;
  openModal(`
    <h2>${isNew ? (esAcc ? "Anotar un accesorio" : "Anotar mantenimiento") : esAcc ? "Editar accesorio" : "Editar mantenimiento"}</h2>
    <p class="muted" style="margin:-6px 0 14px;">${esc(v.name)}${esAcc ? "" : " · Un solo registro con el monto que pagaste, marcando todo lo que te hicieron."}</p>
    <form id="sForm" class="card pad">
      <label class="field"><span>${esAcc ? "Qué le pusiste *" : "Qué se le hizo *"}</span><input id="sTitle" required maxlength="120" value="${esc(s.title || "")}" placeholder="${esAcc ? "Antivuelco, pescantes, parrilla…" : "Mantenimiento, reparación del arranque…"}"></label>
      <div class="two">
        <label class="field"><span>Fecha *</span><input id="sDay" type="date" required value="${s.day || todayApp()}" max="${todayApp()}"></label>
        <label class="field"><span>Kilometraje</span><input id="sOdo" type="number" inputmode="numeric" min="0" value="${s.odometer ?? ""}" placeholder="${v.odometer != null ? nfMoney.format(v.odometer) : "12500"}">
          <small class="hint">De aquí sale cuándo toca la próxima.</small></label>
      </div>
      <div class="two">
        <label class="field"><span>Costo</span><input id="sCost" type="number" inputmode="decimal" step="0.01" min="0" value="${s.cost ?? ""}" placeholder="0.00">
          <small class="hint">Vacío si no costó (garantía).</small></label>
        <label class="field"><span>Moneda</span>
          <select id="sCur">${Object.entries(CUR).map(([k, val]) => `<option value="${k}" ${(s.currency || "NIO") === k ? "selected" : ""}>${val.sym} ${val.label}</option>`).join("")}</select></label>
      </div>
      ${esAcc ? "" : `
      <div class="field" id="sTasksBox">
        <span>¿Qué te hicieron? Marca todo lo que cubrió</span>
        <div class="card">
          ${tasks.length ? tasks.map((t) => {
            const st = taskStatus(t, v);
            return `
            <label class="list-item" style="cursor:pointer;">
              <input type="checkbox" class="sTask" value="${t.id}" style="width:20px; height:20px;" ${marcadas.has(t.id) ? "checked" : ""}>
              <span class="grow ellip">${esc(t.name)}</span>
              ${st.due ? '<span class="badge off">tocaba</span>' : ""}
            </label>`;
          }).join("") : emptyState("wrench", "Este vehículo no tiene tareas.")}
        </div>
        <small class="hint">Desde aquí se cuenta cuándo vuelve a tocar cada una. Si fue una reparación suelta, no marques nada.</small>
      </div>`}
      <label class="field"><span>${esAcc ? "Dónde lo compraste" : "Taller o casa comercial"}</span><input id="sPlace" maxlength="120" value="${esc(s.place || "")}" placeholder="${esAcc ? "Casa Pellas, un amigo…" : "Casa comercial, taller de don Luis"}"></label>
      <label class="field"><span>Nota</span><textarea id="sNote" maxlength="500" placeholder="Qué se cambió, qué quedó pendiente">${esc(s.note || "")}</textarea></label>
      ${isNew && cats.length ? `
        <label class="field"><span>¿Anotarlo también como gasto del hogar?</span>
          <select id="sCat">
            <option value="">No, solo en el vehículo</option>
            ${cats.map((c) => `<option value="${c.id}" ${/transporte|veh|moto|carro/i.test(c.name) ? "selected" : ""}>Sí, en ${esc(c.name)}</option>`).join("")}
          </select>
          <small class="hint">Así la plata cuenta en el mes una sola vez, y si borras el servicio se borra el gasto.</small></label>` : ""}
      <div class="field">
        <span>Factura</span>
        <div id="sReceiptBox"></div>
        <input type="file" id="sFile" accept="image/*" class="vhidden">
      </div>
      <div id="sMsg"></div>
      <button class="btn primary wide" type="submit">${isNew ? "Anotar" : "Guardar cambios"}</button>
    </form>`);

  const paintReceipt = (uri) => {
    $("sReceiptBox").innerHTML = uri
      ? `<div class="receipt-thumb"><img src="${esc(uri)}" alt=""><button type="button" class="btn sm" id="sRm">${icon("cross")}Quitar</button></div>`
      : `<button type="button" class="receipt-drop" id="sDrop" style="width:100%;">${icon("camera")}<div>${s.hasReceipt && receipt === undefined ? "Ya tiene factura. Toca para reemplazarla" : "Tocar para elegir una imagen"}</div></button>`;
    $("sDrop")?.addEventListener("click", () => $("sFile").click());
    $("sRm")?.addEventListener("click", () => { receipt = null; paintReceipt(null); });
  };
  paintReceipt(null);
  if (!isNew && s.hasReceipt) {
    api(`/api/vehicles?id=${s.id}&receipt=1`).then(({ image }) => { if (receipt === undefined && $("sReceiptBox")) paintReceipt(image); }).catch(() => {});
  }
  $("sFile").addEventListener("change", async () => {
    const f = $("sFile").files[0];
    if (!f) return;
    try { receipt = await fileToJpeg(f); paintReceipt(receipt); }
    catch (err) { showErr("sMsg", err); }
    $("sFile").value = "";
  });

  $("sForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button[type="submit"]');
    btn.disabled = true; $("sMsg").innerHTML = "";
    const body = {
      day: $("sDay").value, title: $("sTitle").value, odometer: $("sOdo").value,
      cost: $("sCost").value, currency: $("sCur").value,
      kind: esAcc ? "accessory" : "service",
      taskIds: esAcc ? [] : [...document.querySelectorAll(".sTask:checked")].map((c) => Number(c.value)),
      place: $("sPlace").value, note: $("sNote").value,
    };
    if (receipt !== undefined) body.receipt = receipt;
    try {
      if (isNew) await api("/api/vehicles?service=1", { method: "POST", body: { ...body, vehicleId: v.id, categoryId: $("sCat")?.value || null } });
      else await api(`/api/vehicles?service=${s.id}`, { method: "PUT", body });
      closeModal(); toast(isNew ? (esAcc ? "Accesorio anotado" : "Mantenimiento anotado") : "Guardado");
      await refreshVeh();
    } catch (err) { showErr("sMsg", err); btn.disabled = false; }
  });
}

async function serviceDetail(id) {
  const s = (S.veh.services || []).find((x) => x.id === id);
  if (!s) return;
  const v = vehById(s.vehicleId);
  const cubre = (s.taskIds || []).map((id2) => (S.veh.tasks || []).find((x) => x.id === id2)?.name).filter(Boolean);
  openModal(`
    <div class="row" style="gap:12px; margin-top:6px;">
      <div class="dir" style="width:44px; height:44px; border-radius:999px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); background:var(--soft); color:var(--muted);">${icon("wrench")}</div>
      <div class="grow">
        <div class="muted">${esc(v?.name || "")} · ${prettyDayLong(s.day)}</div>
        <div style="font-size:22px; font-weight:600; letter-spacing:-.02em;">${esc(s.title)}</div>
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="list-item"><span class="muted" style="width:96px; flex:none;">Costo</span><span class="grow">${s.cost == null ? "No costó" : money(s.cost, s.currency)}${s.expenseId ? " · anotado en Gastos" : ""}</span></div>
      <div class="list-item"><span class="muted" style="width:96px; flex:none;">Kilometraje</span><span class="grow">${s.odometer != null ? `${nfMoney.format(s.odometer)} km` : "—"}</span></div>
      <div class="list-item" style="align-items:flex-start;"><span class="muted" style="width:96px; flex:none;">${s.kind === "accessory" ? "Tipo" : "Cubrió"}</span><span class="grow">${s.kind === "accessory" ? "Accesorio o mejora" : cubre.length ? esc(cubre.join(", ")) : "Nada en particular (reparación suelta)"}</span></div>
      ${s.place ? `<div class="list-item"><span class="muted" style="width:96px; flex:none;">Lugar</span><span class="grow">${esc(s.place)}</span></div>` : ""}
      ${s.note ? `<div class="list-item" style="align-items:flex-start;"><span class="muted" style="width:96px; flex:none;">Nota</span><span class="grow" style="white-space:pre-wrap;">${esc(s.note)}</span></div>` : ""}
      <div class="list-item"><span class="muted" style="width:96px; flex:none;">Anotado</span><span class="grow">${esc(s.createdBy || "—")} · ${fechaHora(s.createdAt)}</span></div>
    </div>
    <h3>Factura</h3>
    <div id="sdReceipt">${s.hasReceipt ? `<div class="empty" style="padding:20px;">Cargando…</div>` : `<div class="card">${emptyState("image", "Sin factura. Puedes agregarla editando el servicio.")}</div>`}</div>
    <div class="row" style="gap:8px; margin-top:16px;">
      <button class="btn grow" id="sdEdit">${icon("edit")}Editar</button>
      <button class="btn danger grow" id="sdDel">${icon("trash")}Borrar</button>
    </div>`);
  $("sdEdit").addEventListener("click", () => serviceForm(s));
  $("sdDel").addEventListener("click", async () => {
    if (!(await ask({
      title: "¿Borrar este servicio?",
      text: `${s.title} del ${prettyDay(s.day, { year: true })}. Se borra su factura${s.expenseId ? " y el gasto que generó en el hogar" : ""}.`,
      ok: "Borrar", danger: true,
    }))) return;
    try { await api(`/api/vehicles?service=${s.id}`, { method: "DELETE" }); closeModal(); toast("Servicio borrado"); await refreshVeh(); }
    catch (err) { toast(err.message, "err"); }
  });
  if (s.hasReceipt) {
    try {
      const { image } = await api(`/api/vehicles?id=${s.id}&receipt=1`);
      if ($("sdReceipt")) $("sdReceipt").innerHTML = `<img class="receipt-view" src="${esc(image)}" alt="Factura">`;
    } catch (err) { if ($("sdReceipt")) $("sdReceipt").innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }
  }
}

/* ===========================================================================
   PDF: estado de cuenta.

   Generador minimo escrito a mano (mismo MiniPdf que en asistencia-obra): un
   PDF es texto plano con una tabla de posiciones al final, asi que para tablas

const HELV_W = (() => {
  const w = {};

  put(" ", 278); put("!", 278); put('"', 355); put("#$", 556); put("%", 889); put("&", 667);
  put("'", 191); put("()", 333); put("*", 389); put("+", 584); put(",", 278); put("-", 333);
  put(".", 278); put("/", 278); put("0123456789", 556); put(":;", 278); put("<=>", 584);
  put("?", 556); put("@", 1015);
  put("ADEHKNOQRSTUVXYZBCFGIJLMPW", 667);
  put("C", 722); put("D", 722); put("G", 778); put("I", 278); put("J", 500); put("L", 556);
  put("M", 833); put("N", 722); put("O", 778); put("Q", 778); put("R", 722); put("T", 611);
  put("U", 722); put("W", 944); put("Z", 611); put("F", 611);
  put("abcdeghknopqsuvxyz", 556);
  put("c", 500); put("f", 278); put("i", 222); put("j", 222); put("k", 500); put("l", 222);
  put("m", 833); put("r", 333); put("s", 500); put("t", 278); put("v", 500); put("w", 722);
  put("x", 500); put("y", 500); put("z", 500);
  put("[]\\", 278); put("^", 469); put("_", 556); put("`", 333); put("{}", 334); put("|", 260); put("~", 584);
  return w;
})();
const textWidth = (str, size) => [...String(str)].reduce((t, c) => t + (HELV_W[c] ?? 556), 0) * size / 1000;
function fitText(str, size, max) {
  let t = String(str);
  if (textWidth(t, size) <= max) return t;
  while (t.length > 1 && textWidth(t + "...", size) > max) t = t.slice(0, -1);
  return t + "...";
}
const FONT_OK = (t) => String(t ?? "")
  .replace(/•/g, "\x95").replace(/…/g, "...").replace(/[‘’]/g, "'")
  .replace(/[“”]/g, '"').replace(/[–—−]/g, "-").replace(/[^\x20-\xFF]/g, "?");

class MiniPdf {
  constructor() { this.W = 595; this.H = 842; this.images = []; this.pages = []; this.newPage(); }
  addImage(img) { if (!img || !img.bin || !img.w || !img.h) return -1; this.images.push(img); return this.images.length - 1; }
  newPage() { this.buf = []; this.pages.push(this.buf); return this; }
  text(x, y, str, { size = 10, bold = false, align = "left", gray = 0 } = {}) {
    const t = FONT_OK(str ?? "");
    if (align === "right") x -= textWidth(t, size);
    else if (align === "center") x -= textWidth(t, size) / 2;
    const e = t.replace(/[\\()]/g, (c) => "\\" + c);
    this.buf.push(`BT ${gray} g /${bold ? "F2" : "F1"} ${size} Tf 1 0 0 1 ${x.toFixed(2)} ${(this.H - y).toFixed(2)} Tm (${e}) Tj ET`);
    return this;
  }
  line(x1, y1, x2, y2, { width = 0.6, gray = 0.8 } = {}) {
    this.buf.push(`${gray} G ${width} w ${x1.toFixed(2)} ${(this.H - y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.H - y2).toFixed(2)} l S`);
    return this;
  }
  rect(x, y, w, h, gray = 0.95) {
    this.buf.push(`${gray} g ${x.toFixed(2)} ${(this.H - y - h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
    return this;
  }
  drawImage(idx, x, y, w, h) {
    const img = this.images[idx];
    if (!img) return this;
    const escala = Math.min(w / img.w, h / img.h);
    const iw = img.w * escala, ih = img.h * escala;
    this.buf.push(`q ${iw.toFixed(2)} 0 0 ${ih.toFixed(2)} ${x.toFixed(2)} ${(this.H - y - ih).toFixed(2)} cm /Im${idx} Do Q`);
    return this;
  }
  blob() {
    const objs = [];
    const add = (body) => { objs.push(body); return objs.length; };
    const catalogN = add(""), pagesN = add("");
    const f1 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    const f2 = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    const imgNs = this.images.map((im) => add(
      `<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bin.length} >>\nstream\n${im.bin}\nendstream`));
    const recursoImgs = imgNs.length ? ` /XObject << ${imgNs.map((n, i) => `/Im${i} ${n} 0 R`).join(" ")} >>` : "";
    const pageIds = [];
    for (const buf of this.pages) {
      const stream = buf.join("\n");
      const contN = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
      pageIds.push(add(`<< /Type /Page /Parent ${pagesN} 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >>${recursoImgs} >> /Contents ${contN} 0 R >>`));
    }
    objs[catalogN - 1] = `<< /Type /Catalog /Pages ${pagesN} 0 R >>`;
    objs[pagesN - 1] = `<< /Type /Pages /Kids [${pageIds.map((n) => n + " 0 R").join(" ")}] /Count ${pageIds.length} >>`;
    let out = "%PDF-1.4\n";
    const offsets = [];
    objs.forEach((body, i) => { offsets.push(out.length); out += `${i + 1} 0 obj\n${body}\nendobj\n`; });
    const xref = out.length;
    out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
    for (const off of offsets) out += String(off).padStart(10, "0") + " 00000 n \n";
    out += `trailer\n<< /Size ${objs.length + 1} /Root ${catalogN} 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const bytes = new Uint8Array(out.length);
    for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 0xff;

  }
}

function jpegSize(bin) {
  for (let i = 2; i + 9 < bin.length; ) {
    if (bin.charCodeAt(i) !== 0xFF) { i++; continue; }
    const m = bin.charCodeAt(i + 1);
    if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {
      return { h: (bin.charCodeAt(i + 5) << 8) | bin.charCodeAt(i + 6), w: (bin.charCodeAt(i + 7) << 8) | bin.charCodeAt(i + 8) };
    }
    const len = (bin.charCodeAt(i + 2) << 8) | bin.charCodeAt(i + 3);
    if (len <= 0) break;
    i += 2 + len;
  }
  return null;
}

const PM = 45;    // margen del PDF
function statementPdf(d, list, receipts) {
  const doc = new MiniPdf();
  const hoy = todayApp();
  let pag = 1;
  const footer = () => {
    doc.text(PM, 842 - 32, `Generado el ${prettyDay(hoy, { year: true })} · ${S.account?.name || "Deudas"}`, { size: 7.5, gray: 0.55 });
    doc.text(595 - PM, 842 - 32, `Página ${pag}`, { size: 7.5, gray: 0.55, align: "right" });
  };
  const t = T(d);
  // Cabecera.
  doc.text(PM, PM + 6, S.account?.name || "Deudas", { size: 9, gray: 0.45 });
  doc.text(PM, PM + 30, `Estado de cuenta: ${d.name}`, { size: 18, bold: true });
  const cobro = wordSide(d) === "owed";
  doc.text(PM, PM + 47, [cobro ? "Me deben" : "Yo debo",
    d.counterpart ? (cobro ? `Deudor: ${d.counterpart}` : `A: ${d.counterpart}`) : null,
    KIND_META[d.kind]?.label, d.interestRate ? `${d.interestRate}% anual` : null].filter(Boolean).join("  ·  "), { size: 9.5, gray: 0.4 });
  doc.line(PM, PM + 58, 595 - PM, PM + 58);
  let y = PM + 84;
  const cols = { fecha: PM, det: PM + 62, pres: 595 - PM - 200, abo: 595 - PM - 100, saldo: 595 - PM };
  const salto = (min) => { if (y > 842 - min) { footer(); doc.newPage(); pag++; y = PM + 10; return true; } return false; };
  const head = () => {
    doc.text(cols.fecha, y, "FECHA", { size: 7.5, gray: 0.5, bold: true });
    doc.text(cols.det, y, "DETALLE", { size: 7.5, gray: 0.5, bold: true });
    doc.text(cols.pres, y, cobro ? "PRESTÉ" : "PRÉSTAMO", { size: 7.5, gray: 0.5, bold: true, align: "right" });
    doc.text(cols.abo, y, cobro ? "ME PAGÓ" : "ABONO", { size: 7.5, gray: 0.5, bold: true, align: "right" });
    doc.text(cols.saldo, y, "SALDO", { size: 7.5, gray: 0.5, bold: true, align: "right" });
    y += 6; doc.line(PM, y, 595 - PM, y, { gray: 0.7 }); y += 15;
  };

  // Una seccion por moneda: los saldos nunca se mezclan.
  for (const cur of d.currencies) {
    const tt = d.totals[cur];
    const asc = cronologico(list.filter((e) => e.currency === cur));
    salto(220);
    if (d.currencies.length > 1) { doc.text(PM, y, `En ${CUR[cur].label}`, { size: 12, bold: true }); y += 20; }
    const tiles = [[t.loaned, money(tt.loaned, cur)], [t.paid, money(tt.paid, cur)], ["Saldo actual", money(Math.max(0, tt.balance), cur)]];
    const tw = (595 - 2 * PM - 20) / 3;
    tiles.forEach(([l, v], i) => {
      const x = PM + i * (tw + 10);
      doc.rect(x, y, tw, 46, 0.96);
      doc.text(x + 10, y + 16, l.toUpperCase(), { size: 7.5, gray: 0.5, bold: true });
      doc.text(x + 10, y + 36, v, { size: 14, bold: i === 2 });
    });
    y += 70;
    head();
    let bal = 0;
    for (const e of asc) {
      if (salto(70)) head();
      bal += e.kind === "loan" ? e.amount : -e.amount;
      doc.text(cols.fecha, y, prettyDay(e.day, { year: true }), { size: 9, gray: 0.35 });
      doc.text(cols.det, y, fitText((e.reason || (e.kind === "loan" ? t.loan : t.payment)) + (e.hasReceipt ? " *" : ""), 9, cols.pres - cols.det - 70), { size: 9 });
      if (e.kind === "loan") doc.text(cols.pres, y, money(e.amount, cur), { size: 9, align: "right" });
      else doc.text(cols.abo, y, money(e.amount, cur), { size: 9, align: "right" });
      doc.text(cols.saldo, y, money(bal, cur), { size: 9, align: "right", bold: true });
      y += 5; doc.line(PM, y, 595 - PM, y, { gray: 0.9, width: 0.4 }); y += 13;
    }
    if (!asc.length) { doc.text(PM, y, "Sin movimientos.", { size: 9, gray: 0.5 }); y += 18; }
    y += 6;
    doc.text(cols.saldo, y, `Saldo: ${money(Math.max(0, tt.balance), cur)}`, { size: 11, bold: true, align: "right" });
    y += 30;
  }
  if (list.some((e) => e.hasReceipt)) doc.text(PM, y - 30, receipts ? "* con comprobante adjunto al final" : "* con comprobante (disponible en la app)", { size: 8, gray: 0.5 });
  footer();
  // Comprobantes, uno por pagina.
  for (const r of receipts || []) {
    const bin = dataUriToBinary(r.image), size = bin && jpegSize(bin);
    if (!size) continue;
    doc.newPage(); pag++;
    doc.text(PM, PM + 6, `Comprobante · ${r.entry.kind === "loan" ? t.loan : t.payment} de ${money(r.entry.amount, r.entry.currency)} · ${prettyDay(r.entry.day, { year: true })}`, { size: 10, bold: true });
    if (r.entry.reason) doc.text(PM, PM + 22, r.entry.reason, { size: 9, gray: 0.4 });
    doc.drawImage(doc.addImage({ bin, ...size }), PM, PM + 36, 595 - 2 * PM, 842 - PM - 80 - PM);
    footer();
  }
  return doc.blob();
}

function statementScreen() {
  const d = currentDebt(), list = S.entries?.list || [];
  const conRecibos = list.filter((e) => e.hasReceipt).length;
  openModal(`
    <h2>Estado de cuenta</h2>
    <p class="muted" style="margin:-6px 0 14px;">Un PDF con el resumen y todos los movimientos de <b>${esc(d.name)}</b>, con el saldo después de cada uno.</p>
    ${conRecibos ? `<label class="row card pad" style="gap:10px; cursor:pointer; margin-bottom:12px;"><input type="checkbox" id="stRec" style="width:20px; height:20px;"><span class="grow">Adjuntar los ${plural(conRecibos, "comprobante", "comprobantes")} al final</span></label>` : ""}
    <div class="row" style="gap:8px;">
      <button class="btn primary grow" id="stDown">${icon("download")}Descargar</button>
      <button class="btn grow" id="stShare">${icon("whatsapp")}Compartir</button>
    </div>
    <div id="stMsg"></div>`);
  const build = async () => {
    let receipts = null;
    if ($("stRec")?.checked) {
      $("stMsg").innerHTML = `<div class="msg">Cargando comprobantes…</div>`;
      receipts = [];
      for (const e of list.filter((x) => x.hasReceipt)) {
        try { const { image } = await api(`/api/entries?id=${e.id}&receipt=1`); receipts.push({ entry: e, image }); } catch {}
      }
      $("stMsg").innerHTML = "";
    }
    const name = `Estado de cuenta - ${d.name.replace(/[^\p{L}\p{N} _-]/gu, "")} - ${todayApp()}.pdf`;
    return { blob: statementPdf(d, list, receipts), name };
  };
  $("stDown").addEventListener("click", async () => { try { const { blob, name } = await build(); download(blob, name); closeModal(); toast("PDF generado"); } catch (err) { showErr("stMsg", err); } });
  $("stShare").addEventListener("click", async () => { try { const { blob, name } = await build(); await sharePdf(blob, name); } catch (err) { showErr("stMsg", err); } });
}

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function sharePdf(blob, name) {
  const file = new File([blob], name, { type: "application/pdf" });
  if (!navigator.canShare?.({ files: [file] })) { download(blob, name); toast("Tu equipo no puede adjuntar directo. Se descargó el PDF para que lo adjuntes."); return; }
  try { await navigator.share({ files: [file], title: name }); } catch (err) { if (err?.name !== "AbortError") toast("No se pudo compartir el archivo.", "err"); }
}
// wa.me abre WhatsApp con el texto ya escrito y deja elegir el contacto.
function shareTexto(texto) { window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank", "noopener"); }
// Texto para WhatsApp. En un COBRO se escribe para mandárselo a quien debe, y
// si hay un pago pendiente arranca con el recordatorio: es justo el mensaje que
// uno no sabe cómo empezar.
function resumenTexto(d, list, due = null) {
  const t = T(d);
  const ult = [...list].slice(0, 5).map((e) => `${e.kind === "loan" ? "＋" : "－"} ${prettyDay(e.day)} · ${e.reason || (e.kind === "loan" ? t.loan : t.payment)} · ${money(e.amount, e.currency)}`);
  const varias = d.currencies.length > 1;
  const cobro = wordSide(d) === "owed";
  const recordatorio = cobro && due
    ? [due.vencido
        ? `Hola${d.counterpart ? ` ${d.counterpart.split(" ")[0]}` : ""}, te escribo por el pago de ${money(due.amount, due.currency)} que quedó para el ${prettyDay(due.day, { year: true })} (${plural(-due.dias, "día", "días")} atrás).`
        : `Hola${d.counterpart ? ` ${d.counterpart.split(" ")[0]}` : ""}, recordatorio del pago de ${money(due.amount, due.currency)} ${dueText(due).toLowerCase()} (${prettyDay(due.day, { year: true })}).`, ``]
    : [];
  return [
    ...recordatorio,
    `*${d.name}*${d.counterpart && !cobro ? ` (${d.counterpart})` : ""}`,
    `Al ${prettyDay(todayApp(), { year: true })}`,
    ...d.currencies.flatMap((c) => {
      const tt = d.totals[c];
      return [``, varias ? `_En ${CUR[c].label}_` : null, `${t.loaned}: ${money(tt.loaned, c)}`, `${t.paid}: ${money(tt.paid, c)}`, `*${cobro ? "Saldo pendiente" : "Saldo"}: ${money(Math.max(0, tt.balance), c)}*`];
    }),
    ult.length ? `` : null, ult.length ? `Últimos movimientos:` : null, ...ult,
  ].filter((x) => x !== null).join("\n");
}

applyTheme(currentTheme());
document.querySelectorAll("nav.bottom button").forEach((b) => b.insertAdjacentHTML("afterbegin", icon(b.dataset.icon)));
$("loginMark").innerHTML = icon("coins");
$("brandMark").innerHTML = icon("coins");
$("meBtn").textContent = "…";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

(async () => {
  if (!S.token || !S.me) return;
  try {
    await start();
    const { me, account, recovery } = await api("/api/auth");
    S.me = me; S.account = account || null; S.recovery = recovery || null;
    localStorage.setItem("dd_me", JSON.stringify(me));
    localStorage.setItem("dd_account", JSON.stringify(S.account));
    paintHeader();
    if (S.view === "settings") renderSettings();
  } catch (err) {
    if (/Sesión/.test(err.message)) logout();
    else toast(err.message, "err");
  }
})();
